{th:"cadre",ty:"expl",q:"Explique à un jeune équipier la différence entre urgence vitale et urgence fonctionnelle.",k:["Vitale : vie en danger imminent","Risque de décès faute de soins rapides","Fonctionnelle : vie non menacée immédiatement","Soins rapides pour éviter un handicap"],x:"L’urgence vitale, c’est la vie qui peut s’arrêter si on n’agit pas vite. L’urgence fonctionnelle ne menace pas la vie tout de suite, mais sans soins rapides, la personne peut garder un handicap (une main écrasée, par exemple).",s:"GDO SSUAP §5 p.21"},

/* ================= SÉCURITÉ ================= */
{th:"secu",ty:"qcm",q:"Selon le GDO, quelle part des agressions de SP en intervention survient en SSUAP ?",o:["80 %","50 %","35 %","95 %"],a:0,x:"80 % des cas, le plus souvent par les victimes et/ou leurs proches.",s:"GDO SSUAP ch.2 §4 p.28"},
{th:"secu",ty:"ordre",q:"Classe les types d’agression du plus fréquent au moins fréquent.",o:["Verbales (50 %)","Simples (35 %)","Jets de projectiles (11 %)","Avec arme (4 %)"],x:"50 / 35 / 11 / 4.",s:"GDO SSUAP ch.2 §4 p.28"},
{th:"secu",ty:"qcm",q:"Première cause d’accidents liés à l’activité SSUAP selon le GDO :",o:["Les troubles musculo-squelettiques","Les accidents de la route","Les AES","Les agressions"],a:0,x:"Les TMS (charges lourdes, postures inconfortables ou maintenues). La route reste la 1re cause de mortalité au travail.",s:"GDO SSUAP ch.2 §5-6 p.29"},
{th:"secu",ty:"vf",q:"Pour un ACR, par fort brouillard, le conducteur peut dépasser la vitesse maximale autorisée s’il reste maître de son véhicule.",a:false,x:"Conditions réduisant l’adhérence ou la visibilité : vitesse adaptée dans la limite de la vitesse maximale autorisée, quelle que soit l’urgence.",s:"GDO SSUAP §1.2.1 p.33"},
{th:"secu",ty:"qcm",q:"Le nombre maximum de personnes à bord du VSAV pendant le transport :",o:["Celui du certificat d’immatriculation, hors victime allongée","Celui du certificat, victime comprise","4 personnes plus la victime","Laissé à l’appréciation du chef d’agrès"],a:0,x:"Le chiffre du certificat compte conducteur, personnel, médecin, forces de l’ordre, famille… hors victime allongée. Surplus → véhicules suiveurs.",s:"GDO SSUAP §1.2.2 p.34"},
{th:"secu",ty:"multi",q:"Menace d’agression sur intervention : le chef d’agrès veille à… (coche tout ce qui est juste)",o:["Demander l’engagement des forces de l’ordre","Surveiller l’environnement extérieur","Isoler la victime : surveiller ses mains, éloigner les objets dangereux","Adopter une attitude ferme mais non agressive","Maîtriser physiquement l’agresseur avec l’équipage"],a:[0,1,2,3],x:"Le repli raisonné est possible si risque grave. La contention physique relève des forces de l’ordre.",s:"GDO SSUAP §1.3 p.34"},
{th:"secu",ty:"ordre",q:"Piqûre par une aiguille souillée, sans protocole AES local : remets dans l’ordre.",o:["Laver immédiatement à l’eau potable et au savon","Rincer","Désinfecter au moins 5 minutes (Dakin, javel diluée, à défaut iodé)","Appliquer la procédure du SIS"],x:"Lavage, rinçage, désinfection ≥ 5 min. On ne fait pas saigner.",s:"GDO SSUAP §2.1 p.36"},
{th:"secu",ty:"qcm",q:"Projection de sang dans l’œil :",o:["Rincer abondamment au sérum physiologique, à défaut à l’eau","Désinfecter au Dakin 5 minutes","Frotter avec une compresse","Attendre l’avis du médecin"],a:0,x:"Muqueuses : rinçage abondant au sérum physiologique, à défaut à l’eau.",s:"GDO SSUAP §2.1 p.36"},
{th:"secu",ty:"vf",q:"La protection oculaire est recommandée lors d’une aspiration de mucosités.",a:true,x:"Gestes à risque de projection sur le visage (aspiration, intubation) : protection oculaire.",s:"GDO SSUAP §2.1 p.35"},
{th:"secu",ty:"vf",q:"Le port d’un équipement haute visibilité est obligatoire pour évoluer sur le domaine routier ou autoroutier.",a:true,x:"C’est écrit tel quel dans le GDO.",s:"GDO SSUAP §2 p.35"},
{th:"secu",ty:"qcm",q:"Victime qui tousse et éternue avec de la fièvre. Qui porte un masque ?",o:["Toi, et la victime si c’est possible","La victime seulement","Toi seulement","Personne, les gants suffisent"],a:0,x:"Protection respiratoire pour le SP et, si possible, pour la victime dès qu’elle présente des signes infectieux, tousse ou éternue.",s:"GDO SSUAP §2.1 p.35"},
{th:"secu",ty:"expl",q:"Ton équipier demande pourquoi on se lave les mains alors qu’on avait des gants. Explique.",k:["Les gants peuvent être percés ou contaminer au retrait","Les mains transfèrent la contamination","Lavage ou friction après tout contact et après retrait des EPI","On protège aussi la victime suivante"],x:"Les gants ne sont pas une barrière parfaite, et on se contamine souvent en les retirant. Les mains transportent les germes : friction ou lavage après chaque contact et après le retrait des EPI, pour nous et pour la prochaine victime.",s:"GDO SSUAP §1 p.28 · §2.1 p.36"},

/* ================= BILAN ================= */
{th:"bilan",ty:"ordre",q:"Remets dans l’ordre les 4 regards du bilan.",o:["Apprécier la situation et les dangers","Identifier une menace vitale et la plainte principale","Évaluer une à une les fonctions vitales","Interrogatoire, examen, mesure des paramètres"],x:"1er : situation · 2e : menace vitale · 3e : fonctions vitales · 4e : compléter.",s:"RTN 04AC01 p.65"},
{th:"bilan",ty:"multi",q:"Les 3 principes du bilan (coche tout ce qui est juste) :",o:["Commencer global, aller vers le détail","Traiter en priorité ce qui tue en premier","Fonctionner en cercles de contrôle continu","Toujours terminer les mesures avant d’agir","Commencer par les antécédents"],a:[0,1,2],x:"Global → détail ; ce qui tue en premier ; évaluer, agir, contrôler, réévaluer.",s:"RTN 04AC01 p.65"},
{th:"bilan",ty:"multi",q:"Menaces vitales recherchées au 2e regard (coche tout ce qui est juste) :",o:["Hémorragie externe grave","Obstruction des VA ou VA menacées","Absence de réaction sans respiration ou respiration anormale","Hypoglycémie","Fracture déplacée"],a:[0,1,2],x:"Tableau des menaces vitales du 2e regard. La glycémie se mesure au 4e regard.",s:"RTN 04PR02 p.67"},
{th:"bilan",ty:"qcm",q:"À quel moment commence la surveillance de la victime ?",o:["Dès le 2e regard","Après le 4e regard","Après la transmission du bilan","Dans le VSAV"],a:0,x:"« Dès le 2ème regard, une logique de surveillance débute et se poursuit jusqu’à la fin de l’intervention. »",s:"RTN 04AC01 p.65 · 04PR05 p.71"},
{th:"bilan",ty:"vf",q:"Au 3e regard, si tu identifies une détresse respiratoire, tu termines l’évaluation de la fonction respiratoire avant d’agir.",a:false,x:"Les gestes appropriés sont réalisés immédiatement, même si l’examen de la fonction n’est pas terminé, et un avis médical est demandé.",s:"RTN 04PR03 p.68"},
{th:"bilan",ty:"qcm",q:"Dans PQRST (analyse d’une plainte), le « R » correspond à :",o:["La Région du corps (localisation)","Le Rythme","Les Risques","La Récidive"],a:0,x:"Provoqué par, Qualité, Région, Sévérité, Temps.",s:"RTN 04PR04 p.69"},
{th:"bilan",ty:"ordre",q:"Recherche des antécédents : remets les lettres MHTAF dans l’ordre du référentiel.",o:["Médicaux et chirurgicaux","Hospitalisations","Traitements en cours","Allergies","Facteurs de risque"],x:"M-H-T-A-F.",s:"RTN 04PR04 p.69"},
{th:"bilan",ty:"multi",q:"Paramètres mesurés systématiquement au 4e regard (coche tout ce qui est juste) :",o:["Fréquence respiratoire","SpO₂","Fréquence cardiaque","Pression artérielle","Glycémie capillaire","Température"],a:[0,1,2,3],x:"FR, SpO₂, FC, PA systématiques ; glycémie, température, ECG selon contexte.",s:"RTN 04PR04 p.70"},
{th:"bilan",ty:"vf",q:"Compte tenu de la fiabilité des appareils, les mesures des paramètres priment sur les signes cliniques.",a:false,x:"C’est l’inverse : « la prise en compte des signes cliniques prime sur les mesures des paramètres vitaux ».",s:"RTN 04PR04 p.70"},
{th:"bilan",ty:"qcm",q:"À l’issue du 4e regard, les éléments sont transmis au médecin régulateur :",o:["Sans les interpréter","Avec ton hypothèse diagnostique","Seulement s’ils sont anormaux","Après l’arrivée à l’hôpital"],a:0,x:"« L’ensemble des éléments recueillis doit être transmis au médecin régulateur sans les interpréter. »",s:"RTN 04PR04 p.70"},
{th:"bilan",ty:"qcm",q:"Victime en détresse vitale : fréquence de renouvellement des paramètres ?",o:["Toutes les 5 minutes","Toutes les 10 à 15 minutes","Toutes les 2 minutes","Toutes les 30 minutes"],a:0,x:"5 min en cas de détresse vitale, sinon 10 à 15 min.",s:"RTN 04PR05 p.71"},
{th:"bilan",ty:"multi",q:"Demande de renfort médical pour détresse vitale : éléments à préciser d’emblée (coche tout ce qui est juste) :",o:["Nature de l’intervention","Motif de la demande de renfort","Sexe et âge de la victime","Traitements en cours complets","Antécédents chirurgicaux"],a:[0,1,2],x:"Transmettre sans délai nature, motif, sexe et âge ; le bilan complet suit dans les meilleurs délais.",s:"RTN 04PR06 p.72"},
{th:"bilan",ty:"qcm",q:"Au 2e regard, la victime a perdu connaissance et est sur le ventre. Avant de rechercher sa ventilation, tu :",o:["L’installes sur le dos","La mets en PLS","Cherches un pouls fémoral","Mesures sa SpO₂"],a:0,x:"Installer une victime qui a perdu connaissance sur le dos avant de rechercher sa ventilation (retournement).",s:"RTN 04PR02 p.67"},
{th:"bilan",ty:"vf",q:"Un casque de protection doit être retiré dès le 2e regard si les voies aériennes sont menacées.",a:true,x:"Dans le tableau du 2e regard : en présence d’un casque, le retirer pour assurer la liberté des VA.",s:"RTN 04PR02 p.67 · 04FT03"},
{th:"bilan",ty:"qcm",q:"Au 1er regard, tu découvres une victime de plus que prévu, cachée derrière un véhicule. Tu :",o:["Demandes les moyens complémentaires le plus rapidement possible et corriges les infos de départ","Attends la fin du bilan de la première","T’occupes d’abord de la plus bruyante","Ne transmets qu’à l’arrivée à l’hôpital"],a:0,x:"Objectifs du 1er regard : nombre de victimes, moyens suffisants, compléter/corriger les infos de départ, demander tôt.",s:"RTN 04PR01 p.66"},
{th:"bilan",ty:"expl",q:"Explique en 30 secondes ce qu’est un « cercle de contrôle » pendant le bilan.",k:["Évaluer","Agir","Contrôler l’action","Réévaluer, en boucle jusqu’à la fin"],x:"On n’évalue pas une fois pour toutes : on évalue, on agit, on vérifie que le geste marche, puis on réévalue, et on recommence jusqu’à la fin de l’intervention.",s:"RTN 04AC01 p.65"},
{th:"bilan",ty:"multi",q:"Interrogatoire d’un traumatisé : la recherche du mécanisme précise… (coche tout ce qui est juste)",o:["La nature (chute, AVP, heurt…)","L’intensité (hauteur, décélération)","Les éléments particuliers (place, casque, ceinture)","Ses antécédents familiaux"],a:[0,1,2],x:"Nature, intensité, éléments particuliers.",s:"RTN 04PR04 p.69"},

/* ================= PARAMÈTRES ================= */
{th:"param",ty:"qcm",q:"Fréquence respiratoire normale chez le nourrisson :",o:["30 à 40/min","20 à 30/min","40 à 60/min","12 à 20/min"],a:0,x:"Adulte 12-20, enfant 20-30, nourrisson 30-40, nouveau-né 40-60.",s:"RTN 04FT07 p.83"},
{th:"param",ty:"qcm",q:"Fréquence cardiaque normale chez l’enfant :",o:["70 à 140/min","60 à 100/min","100 à 160/min","120 à 160/min"],a:0,x:"Adulte 60-100, enfant 70-140, nourrisson 100-160, nouveau-né 120-160.",s:"RTN 04FT09 p.88"},
{th:"param",ty:"qcm",q:"FR normale du nouveau-né :",o:["40 à 60/min","30 à 40/min","20 à 30/min","60 à 80/min"],a:0,x:"Nouveau-né 40-60.",s:"RTN 04FT07 p.83"},
{th:"param",ty:"qcm",q:"FC normale du nourrisson :",o:["100 à 160/min","70 à 140/min","120 à 160/min","80 à 120/min"],a:0,x:"Nourrisson 100-160 ; nouveau-né 120-160.",s:"RTN 04FT09 p.88"},
{th:"param",ty:"vf",q:"Chez l’adulte, en conditions normales, on observe un mouvement ventilatoire environ toutes les 5 secondes, sans pause de plus de 6 secondes.",a:true,x:"Toutes les 5 s chez l’adulte (3-4 s chez l’enfant), réguliers, sans pause > 6 s.",s:"RTN 04FT07 p.83"},
{th:"param",ty:"qcm",q:"Durée maximale de recherche de la respiration chez une victime qui a perdu connaissance :",o:["10 secondes","5 secondes","15 secondes","30 secondes"],a:0,x:"Durant dix secondes au plus, avec la joue, l’oreille, les yeux.",s:"RTN 04FT07 p.82"},
{th:"param",ty:"qcm",q:"Où recherche-t-on le pouls chez le nourrisson ?",o:["Au pli de l’aine (fémoral)","À la carotide","Au poignet (radial)","Au pli du coude"],a:0,x:"Carotidien chez l’adulte et l’enfant, fémoral chez le nourrisson.",s:"RTN 04FT09 p.87"},
{th:"param",ty:"vf",q:"Une intoxication au monoxyde de carbone fait baisser la SpO₂ affichée.",a:false,x:"Les intoxications aux fumées et au CO faussent la mesure et donnent à tort des valeurs rassurantes.",s:"RTN 04FT08 p.85"},
{th:"param",ty:"multi",q:"Situations où l’oxymètre peut ne pas donner de résultat fiable (coche tout ce qui est juste) :",o:["Victime agitée ou qui tremble","Extrémités froides","Détresse circulatoire","Vernis à ongles","Victime allongée à plat"],a:[0,1,2,3],x:"Agitation, tremblements, froid, détresse circulatoire, maladies vasculaires, pigmentation, vernis, doigt sale.",s:"RTN 04FT08 p.85"},
{th:"param",ty:"qcm",q:"Valeur normale du TRC :",o:["Inférieur à 2 secondes","Inférieur à 3 secondes","Inférieur à 5 secondes","Supérieur à 2 secondes"],a:0,x:"Recoloration du lit de l’ongle < 2 s ; > 2 s = signe de détresse circulatoire.",s:"RTN 04FT09 p.88"},
{th:"param",ty:"qcm",q:"Mesure de la PA par palpation :",o:["Ne donne que la pression systolique","Donne systolique et diastolique","Est préférable à l’automatique","Se fait sans brassard"],a:0,x:"Méthode pour ambiance bruyante ; seule la systolique est obtenue.",s:"RTN 04FT10 p.90"},
{th:"param",ty:"vf",q:"Chez l’enfant, une PA systolique inférieure à 90 mmHg est la valeur de référence de la détresse circulatoire.",a:false,x:"Contrairement à l’adulte, il ne peut y avoir de valeur de référence chez l’enfant : le secouriste transmet la valeur pour avis.",s:"RTN 04FT10 p.91"},
{th:"param",ty:"qcm",q:"Mesure de la PA par auscultation : de combien gonfle-t-on au-delà de la disparition du bruit du pouls ?",o:["30 mmHg","10 mmHg","50 mmHg","100 mmHg"],a:0,x:"Gonfler jusqu’à ne plus entendre le pouls, puis 30 mmHg de plus ; dégonfler à 2-3 mmHg/s.",s:"RTN 04FT10 p.90"},
{th:"param",ty:"qcm",q:"Score EVDA : la victime n’ouvre les yeux que lorsque tu lui demandes. Elle est :",o:["V (réactive à la voix)","E (éveillée)","D (réactive à la douleur)","A (aréactive)"],a:0,x:"Elle ne réagit qu’à la stimulation verbale : V.",s:"RTN 04FT12 p.97"},
{th:"param",ty:"qcm",q:"Pour le score EVDA, la seule stimulation douloureuse autorisée est :",o:["Une pression sur la base d’un ongle","Un pincement du trapèze","Une friction du sternum","Une pression sus-orbitaire"],a:0,x:"« Aucune autre méthode de stimulation douloureuse ne doit être réalisée. »",s:"RTN 04FT12 p.97"},
{th:"param",ty:"qcm",q:"Score de Glasgow considéré comme normal dans le référentiel :",o:["Supérieur à 12","Égal à 8","Supérieur à 6","Égal à 3"],a:0,x:"En conditions normales, Glasgow > 12.",s:"RTN 04FT12 p.98"},
{th:"param",ty:"multi",q:"Test FAST : que demandes-tu à la victime ? (coche tout ce qui est juste)",o:["Sourire ou montrer les dents","Bras tendus devant elle, yeux fermés, 10 secondes","Répéter une phrase","Toucher son nez du doigt","Tirer la langue"],a:[0,1,2],x:"Face, Arm (10 s), Speech, Time. Une seule anomalie suffit pour un score positif.",s:"RTN 04FT12 p.98"},
{th:"param",ty:"vf",q:"Au FAST, il faut au moins deux anomalies pour considérer le score positif.",a:false,x:"Asymétrie faciale, OU faiblesse d’un bras, OU anomalie de la parole : une seule suffit → avis médical immédiat.",s:"RTN 04FT12 p.98"},
{th:"param",ty:"qcm",q:"Seuil de glycémie en dessous duquel le sucre est indiqué :",o:["0,6 g/L (3,3 mmol/L ; 60 mg/dL)","0,8 g/L","1 g/L","0,4 g/L"],a:0,x:"< 60 mg/dL, < 3,3 mmol/L, < 0,6 g/L.",s:"RTN 04FT13 p.99"},
{th:"param",ty:"multi",q:"Indications de la glycémie capillaire par le secouriste (coche tout ce qui est juste) :",o:["Signes d’AVC","Troubles du comportement (agitation, agressivité)","Perte de connaissance","Malaise à l’effort à jeun","Entorse de cheville isolée"],a:[0,1,2,3],x:"AVC, malaise possiblement hypoglycémique (diabétique, effort, jeûne), troubles du comportement, PC, demande du régulateur.",s:"RTN 04FT13 p.99"},
{th:"param",ty:"qcm",q:"Où piques-tu pour une glycémie capillaire ?",o:["Face latérale de la 3e phalange du majeur, de l’annulaire ou de l’auriculaire","Pulpe de l’index","Pulpe du pouce","Lobe de l’oreille en première intention"],a:0,x:"Face latérale, en excluant le pouce et l’index.",s:"RTN 04FT13 p.100"},
{th:"param",ty:"ordre",q:"Glycémie capillaire : remets dans l’ordre.",o:["Friction hydroalcoolique et gants","Nettoyer le doigt à l’eau (ou eau + savon) puis sécher","Insérer la bandelette, attendre que le lecteur soit prêt","Piquer la face latérale du doigt","Approcher la bandelette de la goutte, lire le résultat","Compresser, éliminer autopiqueur (OPCT) et bandelette (DASRI)"],x:"Le séchage soigneux évite de diluer la goutte. Transmettre avec l’unité.",s:"RTN 04FT13 p.100"},
{th:"param",ty:"vf",q:"La glycémie se transmet au régulateur en précisant l’unité de mesure.",a:true,x:"0,6 g/L, 60 mg/dL ou 3,3 mmol/L ne se lisent pas pareil : l’unité est obligatoire.",s:"RTN 04FT13 p.100"},
{th:"param",ty:"vf",q:"La mesure de la température est systématique chez toute victime anormalement chaude ou froide au toucher.",a:true,x:"Systématique en cas de suspicion d’hypothermie ou d’hyperthermie.",s:"RTN 04FT14 p.101"},
{th:"param",ty:"expl",q:"Explique pourquoi la clinique prime sur la SpO₂ chez une victime sortie d’un incendie.",k:["Le CO fausse la mesure","Valeur faussement rassurante","Signes cliniques et contexte d’abord","O₂ 15 L/min quelle que soit la SpO₂"],x:"Le saturomètre ne fait pas la différence entre l’oxygène et le monoxyde de carbone fixés sur l’hémoglobine : il peut afficher 99 % chez un intoxiqué. On se fie au contexte et aux signes, et on met le MHC à 15 L/min quoi qu’il affiche.",s:"RTN 04FT08 p.85 · 05FT01 p.115"},

/* ================= URGENCES VITALES ================= */
{th:"vital",ty:"qcm",q:"Garrot : où le poses-tu ?",o:["À quelques centimètres de la plaie (idéalement 5 à 7 cm), entre la plaie et la racine du membre","À la racine du membre systématiquement","Juste sur l’articulation la plus proche","Sous la plaie, côté extrémité"],a:0,x:"Entre la plaie et la racine, 5-7 cm idéalement, jamais sur une articulation.",s:"RTN 05FT04 p.123"},
{th:"vital",ty:"qcm",q:"Garrot improvisé : caractéristiques du lien ?",o:["Toile solide non élastique, 3 à 5 cm de large, au moins 1,50 m","Élastique de prise de sang","Cordelette fine de 1 cm","Ceinture élastique de 10 cm"],a:0,x:"Lien large non élastique 3-5 cm × ≥ 1,50 m, barre de 10-20 cm.",s:"RTN 05FT04 p.123"},
{th:"vital",ty:"vf",q:"Un garrot posé peut être desserré par l’équipage toutes les 30 minutes pour limiter les lésions.",a:false,x:"Une fois posé, il ne doit être desserré que sur ordre d’un médecin.",s:"RTN 05FT04 p.124"},
{th:"vital",ty:"qcm",q:"Le saignement persiste malgré un garrot bien serré. Tu :",o:["Resserres, puis poses un 2e garrot entre le premier et la racine et/ou une gaze hémostatique","Retires le garrot et comprimes","Poses un 2e garrot sous la plaie","Surélèves le membre et attends"],a:0,x:"Resserrer ; si insuffisant, 2e garrot au-dessus du premier et/ou gaze hémostatique avec pansement compressif.",s:"RTN 05FT04 p.124"},
{th:"vital",ty:"multi",q:"Localisations où la gaze imbibée de substance hémostatique est indiquée (coche tout ce qui est juste) :",o:["Creux axillaire","Pli de l’aine","Cou","Fesses","Plaie abdominale avec viscères visibles"],a:[0,1,2,3],x:"Racine de membre, fesses, cou, tête. Jamais au contact des organes et viscères.",s:"RTN 05FT05 p.125"},
{th:"vital",ty:"qcm",q:"Gaze hémostatique : durée minimale de pression après sa mise en place :",o:["3 minutes","1 minute","10 minutes","30 secondes"],a:0,x:"Pression au minimum 3 min et jusqu’à l’arrêt, puis pansement compressif.",s:"RTN 05FT05 p.125"},
{th:"vital",ty:"vf",q:"Une fois l’hémorragie arrêtée, on peut retirer la gaze hémostatique pour contrôler la plaie.",a:false,x:"« NE JAMAIS RETIRER UNE GAZE IMBIBÉE DE SUBSTANCE HÉMOSTATIQUE DE LA PLAIE. »",s:"RTN 05FT05 p.125"},
{th:"vital",ty:"qcm",q:"Pourquoi allonger une victime qui saigne ?",o:["La position allongée retarde ou empêche la détresse liée à la perte de sang","Pour faciliter la pose du garrot uniquement","Pour qu’elle ne voie pas la plaie","Ce n’est pas recommandé"],a:0,x:"Allonger retarde ou empêche l’installation de la détresse circulatoire.",s:"RTN 05PR01 p.117"},
{th:"vital",ty:"vf",q:"Fracture ouverte avec un fragment d’os visible qui saigne modérément : tu comprimes directement sur l’os pour arrêter le saignement.",a:false,x:"Ne toucher ni l’os ni le corps étranger ; si le saignement est important et massif → garrot.",s:"RTN 05PR01 p.117"},
{th:"vital",ty:"multi",q:"Situations où la compression directe est « impossible » et justifie d’emblée garrot ou gaze (coche tout ce qui est juste) :",o:["Nombreuses victimes","Plaie inaccessible","Corps étranger dans la plaie","Morceau d’os visible","Victime anxieuse"],a:[0,1,2,3],x:"Nombreuses victimes, catastrophes, violence collective, nombreuses lésions, plaie inaccessible, corps étranger, os visible.",s:"RTN 05PR01 p.117"},
{th:"vital",ty:"qcm",q:"Obstruction complète chez l’adulte debout : après 1 à 5 claques inefficaces, tu réalises :",o:["1 à 5 compressions abdominales","30 compressions thoraciques au sol","5 nouvelles claques puis la RCP","Un balayage digital à l’aveugle"],a:0,x:"Alterner 1 à 5 claques et 1 à 5 compressions (abdominales chez l’adulte et l’enfant).",s:"RTN 05PR03 p.129"},
{th:"vital",ty:"multi",q:"Compressions thoraciques (et non abdominales) en cas d’obstruction complète chez… (coche tout ce qui est juste)",o:["Le nourrisson","La femme enceinte","La personne obèse dont on ne peut encercler l’abdomen","La personne alitée difficilement mobilisable","L’enfant de 8 ans"],a:[0,1,2,3],x:"Chez l’enfant : compressions abdominales.",s:"RTN 05PR03 p.129 · 05FT09 p.133"},

{th:"vital",ty:"qcm",q:"PLS à deux secouristes chez une victime suspecte de traumatisme : qui commande ?",o:["Le secouriste placé à la tête","Celui qui retourne la victime","Le chef d’agrès quel que soit son poste","Le médecin régulateur par radio"],a:0,x:"Manœuvre commandée par le secouriste 1, à la tête ; réalisée après avis médical et collier si indiqué.",s:"RTN 05FT17 p.161"},

{th:"vital",ty:"expl",q:"Explique à un témoin pourquoi on reprend le massage tout de suite après le choc.",k:["Le cœur ne repart pas efficacement tout de suite","Les compressions assurent la circulation","Chaque interruption fait chuter la perfusion du cerveau et du cœur","Le DAE réanalyse toutes les 2 minutes"],x:"Même si le choc a fonctionné, le cœur met un moment à pomper correctement. Pendant ce temps, c’est notre massage qui fait circuler le sang ; chaque pause fait chuter la pression. Le DAE refera son analyse dans deux minutes.",s:"RTN 05PR04 p.138"},
{th:"vital",ty:"expl",q:"Explique en 30 secondes l’intérêt du rôle de « coach » pendant une RCP.",k:["Guider","Encourager","Corriger les gestes (fréquence, profondeur, relâchement)","Organiser les relais et limiter les interruptions"],x:"Un intervenant formé ne masse pas : il regarde, il compte, corrige la profondeur et le rythme, organise les relais toutes les 2 minutes pendant les analyses et veille à ce qu’on s’arrête le moins possible.",s:"RTN 05PR04-05 p.138-140"},

{th:"detr",ty:"multi",q:"Signes d’une détresse circulatoire en constitution (coche tout ce qui est juste) :",o:["Impossibilité de rester assis ou debout (vertiges)","Sensation de soif","Accélération du pouls d’une mesure à l’autre","Pincement puis chute progressive de la PA","Hausse progressive de la SpO₂"],a:[0,1,2,3],x:"Même si les mesures restent dans les limites de la normale.",s:"RTN 05AC08 p.169"},

{th:"malaise",ty:"qcm",q:"Qui décide de l’administration de l’auto-injecteur personnel d’une victime en réaction allergique grave ?",o:["La victime elle-même ou le médecin régulateur","Le chef d’agrès seul","L’équipier le plus ancien","Personne avant l’arrivée du SMUR"],a:0,x:"Administrer à la demande de la victime ou du médecin régulateur le traitement prescrit.",s:"RTN 06PR07 p.199"},
{th:"malaise",ty:"expl",q:"Explique pourquoi on fait une glycémie devant un patient agressif et confus sentant l’alcool.",k:["L’hypoglycémie donne des troubles du comportement","Elle peut ressembler à une ivresse","Indication du RTN : troubles du comportement","Une hypo se corrige vite et peut tuer"],x:"Une hypoglycémie donne agitation, agressivité, confusion : ça ressemble à une ivresse. Le RTN demande une glycémie devant tout trouble du comportement. Si c’est une hypo, elle se corrige vite ; si on la rate, elle peut être grave.",s:"RTN 04FT13 p.99 · GDO §3.7 p.56"},

{th:"trauma",ty:"qcm",q:"Arrosage d’une brûlure thermique :",o:["Eau courante tempérée, faible pression, au moins 10 min, idéalement 20","Eau glacée 5 min","Jet puissant 10 min","Eau tiède 2 min puis pommade"],a:0,x:"Tempérée, faible pression, ≥ 10 min, idéalement 20.",s:"RTN 07PR01 p.203"},
{th:"trauma",ty:"qcm",q:"Pour estimer une petite surface brûlée chez l’enfant, la surface de sa main (paume + doigts) vaut :",o:["1 %","5 %","9 %","0,5 %"],a:0,x:"Paume et doigts de la victime = 1 % quel que soit l’âge.",s:"RTN 07AC01 p.202"},
{th:"trauma",ty:"multi",q:"Critères de brûlure GRAVE (coche tout ce qui est juste) :",o:["Cloques dont la surface dépasse la moitié de la paume de la victime","Brûlure circulaire d’un membre","Brûlure des mains ou du visage","Origine électrique ou chimique","Rougeur douloureuse de 2 cm sur l’avant-bras d’un adulte"],a:[0,1,2,3],x:"Aussi : destruction profonde, voisinage d’orifices, articulations, rougeur étendue chez l’enfant.",s:"RTN 07AC01 p.201"},
{th:"trauma",ty:"vf",q:"Une brûlure profonde blanchâtre ou noirâtre est souvent peu douloureuse.",a:true,x:"Les terminaisons nerveuses ont été détruites.",s:"RTN 07AC01 p.202"},
{th:"trauma",ty:"qcm",q:"Brûlure grave : quand demandes-tu l’avis médical ?",o:["Dès le début de l’arrosage","À la fin des 20 minutes","Après avoir emballé la victime","Au départ vers l’hôpital"],a:0,x:"Dès le début de l’arrosage ; le refroidissement se poursuit selon les consignes.",s:"RTN 07PR01 p.203"},
{th:"trauma",ty:"qcm",q:"Projection de produit chimique sur les vêtements :",o:["Rincer tout le corps et ôter sous l’eau les vêtements imbibés","Retirer les vêtements à sec puis rincer","Neutraliser avec un produit inverse","Essuyer le produit avec une compresse"],a:0,x:"Se protéger, rinçage immédiat et abondant à l’eau tempérée, vêtements retirés sous l’eau.",s:"RTN 07PR01 p.204"},
{th:"trauma",ty:"vf",q:"En cas d’ingestion d’un produit caustique, on fait boire de l’eau pour diluer.",a:false,x:"Ne jamais faire vomir ni boire, conserver l’emballage.",s:"RTN 07PR01 p.204"},
{th:"trauma",ty:"ordre",q:"Conditionner un doigt amputé : remets dans l’ordre.",o:["Récupérer le segment le plus vite possible","L’envelopper dans un pansement stérile ou tissu propre humidifié","Le placer dans un sac plastique étanche","Placer ce sac dans un 2e sac avec glace ou eau glacée","Noter le nom de la victime et l’heure"],x:"Jamais de contact direct avec la glace ; ne pas congeler ; il part avec la victime.",s:"RTN 07FT04 p.216"},
{th:"trauma",ty:"vf",q:"Sur le moignon d’une amputation qui ne saigne plus, aucun pansement n’est nécessaire.",a:false,x:"Pansement compressif sur la plaie, même en l’absence de saignement.",s:"RTN 07PR03 p.215"},
{th:"trauma",ty:"qcm",q:"Traumatisme du membre supérieur, victime consciente : position d’attente ?",o:["Assise, le membre contre la poitrine soutenu par la main valide","Allongée à plat","PLS côté atteint","Debout bras pendant"],a:0,x:"Membre inférieur : allongée ; supérieur : assise.",s:"RTN 07PR07 p.225"},
{th:"trauma",ty:"vf",q:"On applique du froid sur toute fracture, y compris ouverte, pour limiter le gonflement.",a:false,x:"Froid si possible, sauf s’il s’agit d’une fracture ouverte.",s:"RTN 07PR07 p.225"},
{th:"trauma",ty:"qcm",q:"Fracture avec déformation importante de jambe, pouls distal présent :",o:["Immobiliser en respectant la déformation","Réaligner doucement avant d’immobiliser","Tirer dans l’axe jusqu’à ce que la jambe soit droite","Ne pas immobiliser"],a:0,x:"Le réalignement est réalisé par un médecin ou à sa demande (fiche réalignement PSE2).",s:"RTN 07PR07 p.225"},
{th:"trauma",ty:"vf",q:"L’immobilisation de la colonne vertébrale passe avant le traitement d’une détresse respiratoire.",a:false,x:"« L’immobilisation de la colonne vertébrale ne doit jamais passer avant la prise en charge d’une détresse vitale. »",s:"RTN 07PR08 p.241"},
{th:"trauma",ty:"multi",q:"Réponses NON fiables dans l’arbre rachis (coche tout ce qui est juste) :",o:["Influence de l’alcool","Altération du niveau de conscience","Douleur distrayante (atteinte traumatique sévère)","Non coopération, difficultés de communication","Victime de plus de 65 ans"],a:[0,1,2,3],x:"Plus la présence d’une détresse vitale. L’âge > 65 ans est un critère (E), pas un critère de fiabilité.",s:"RTN 07PR08 p.242"},
{th:"trauma",ty:"multi",q:"Traumatismes à haut risque d’atteinte du rachis (D) (coche tout ce qui est juste) :",o:["Chute sur la tête d’une hauteur > 1 m (plongeon)","Chute sur les pieds ou les fesses de plus de 3 m","Véhicule à plus de 40 km/h avec arrêt brutal sur moins de 10 m","Retournement du véhicule","Chute de sa hauteur sur les fesses"],a:[0,1,2,3],x:"Aussi : éjection, déclenchement des airbags, deux-roues, piéton renversé, chute de cheval, loisirs motorisés.",s:"RTN 07PR08 p.242"},
{th:"trauma",ty:"ordre",q:"Remets dans l’ordre les questions de l’arbre décisionnel rachis.",o:["Les réponses de la victime sont-elles fiables ?","Signes d’atteinte du rachis ou de la moelle ?","Traumatisme à haut risque ?","Âge > 65 ans ou antécédents à risque ?"],x:"Une réponse « défavorable » à n’importe quelle étape → immobilisation corps entier.",s:"RTN 07PR08 p.242"},
{th:"trauma",ty:"qcm",q:"Chute de sa hauteur, 45 ans, fiable, aucune douleur rachidienne, aucun signe neurologique, aucun antécédent. Rachis ?",o:["Pas d’immobilisation du rachis","Collier cervical seul","Immobilisation corps entier","Plan dur et collier par sécurité"],a:0,x:"Fiable, ni B ni C, pas de D, pas de E → pas d’immobilisation.",s:"RTN 07PR08 p.242"},
{th:"trauma",ty:"qcm",q:"Même victime fiable sans signe, chute de sa hauteur, mais 78 ans et ostéoporose :",o:["Immobilisation du rachis corps entier","Pas d’immobilisation","Collier seul","Laisser marcher jusqu’au VSAV"],a:0,x:"Critère (E) : âge > 65 ans ou antécédents à risque → immobilisation.",s:"RTN 07PR08 p.242"},
{th:"trauma",ty:"vf",q:"Plaie pénétrante isolée du thorax : on immobilise soigneusement le rachis avant tout départ.",a:false,x:"Ne pas perdre de temps à immobiliser : l’évacuation est prioritaire.",s:"RTN 07PR08 p.243"},
{th:"trauma",ty:"qcm",q:"Traumatisé du rachis agité, alcoolisé, qui refuse l’immobilisation :",o:["Ne pas l’immobiliser de force, maintenir la tête à 2 mains si possible, avis médical","Le maintenir à 4 et poser le collier","Le laisser partir","Le sangler sur le plan dur"],a:0,x:"Laisser s’installer dans la position la plus confortable, maintien tête dans l’axe, avis médical.",s:"RTN 07PR08 p.243"},
{th:"trauma",ty:"qcm",q:"Traumatisme du bassin : la contention pelvienne est mise en place…",o:["Si détresse circulatoire associée, après avis médical ou si avis impossible","Systématiquement à tout traumatisme du bassin","Seulement à l’hôpital","Si la victime marche"],a:0,x:"Bassin + signes de détresse circulatoire : après avis médical, ou en cas d’impossibilité d’obtenir l’avis.",s:"RTN 07PR10 p.264"},
{th:"trauma",ty:"vf",q:"Pour un traumatisme du bassin, on dénude le bassin en préservant l’intimité pour rechercher plaies, hématomes, sang sur les sous-vêtements.",a:true,x:"Et on vérifie le bas du dos et les fesses lors des mobilisations.",s:"RTN 07PR10 p.264"},
{th:"trauma",ty:"qcm",q:"Traumatisme du crâne sans détresse : premier geste spécifique ?",o:["Maintenir la tête en position neutre","Mettre en PLS","Asseoir la victime","Glace sur la bosse avant tout"],a:0,x:"Tête neutre, retrait du casque, O₂ si besoin, rachis si besoin, surveillance (aggravation brutale).",s:"RTN 07PR09 p.262"},
{th:"trauma",ty:"expl",q:"Explique à ton équipier pourquoi une fracture de fémur rend les réponses de la victime « non fiables » pour le rachis.",k:["Douleur distrayante","Masque une douleur du rachis","La victime ne localise plus bien","Donc immobilisation"],x:"Une douleur très forte ailleurs attire toute l’attention : la victime peut ne pas sentir ou signaler sa douleur au dos. Ses réponses ne sont plus fiables, donc l’arbre nous fait immobiliser.",s:"RTN 07PR08 p.242"},

/* ================= CIRCONSTANCIELLES ================= */
{th:"circ",ty:"vf",q:"Chez une victime de noyade, la probabilité d’une lésion de la colonne vertébrale est très faible : on la sort rapidement de l’eau.",a:true,x:"Immobilisation avant sortie seulement dans de rares cas (plongeon en eau peu profonde, accident de sport nautique avec signes).",s:"RTN 08PR02 p.273"},
{th:"circ",ty:"qcm",q:"Secouriste seul face à un noyé en arrêt : combien de cycles de RCP avant d’aller alerter ?",o:["5 cycles","1 cycle","Aucun, alerter d’abord","10 cycles"],a:0,x:"Isolé : cinq cycles de RCP avant de quitter la victime pour aller alerter.",s:"RTN 08PR02 p.273"},
{th:"circ",ty:"vf",q:"Chez un noyé, des compressions abdominales sont utiles pour vider l’eau des voies aériennes avant la RCP.",a:false,x:"Les techniques de désobstruction sont dangereuses : régurgitation, inhalation, lésions, retard de RCP. La quantité d’eau inhalée est faible.",s:"RTN 08PR02 p.274"},
{th:"circ",ty:"qcm",q:"Noyé en ACR sur un bateau pneumatique au large :",o:["Les compressions peuvent être réalisées dans l’embarcation","Aucune compression avant d’être à terre","Compressions dans l’eau pour gagner du temps","Seulement des insufflations"],a:0,x:"Compressions seulement hors de l’eau : sur terre ou dans une embarcation (dispositifs automatiques possibles).",s:"RTN 08PR02 p.273"},
{th:"circ",ty:"vf",q:"La mousse aux lèvres d’un noyé gêne la ventilation et doit être soigneusement retirée avant d’insuffler.",a:false,x:"Mélange d’eau et d’air très fréquent, ne gêne pas la ventilation : ne pas insister pour l’enlever.",s:"RTN 08PR02 p.274"},
{th:"circ",ty:"qcm",q:"Noyé conscient, frissonnant : tu le sèches…",o:["Prudemment et sans friction","Énergiquement pour le réchauffer","Pas du tout, on le couvre mouillé","Avec un sèche-cheveux"],a:0,x:"Déshabiller sans mobilisation intempestive, sécher sans friction, couvertures, abri du vent.",s:"RTN 08PR02 p.273"},
{th:"circ",ty:"qcm",q:"Coup de chaleur d’exercice : technique de refroidissement de référence ?",o:["Immersion dans un bain d’eau froide ou glacée, tête hors de l’eau, eau remuée","Linges humides sur le front","Ventilateur seul","Boisson fraîche seule"],a:0,x:"Refroidissement actif avancé.",s:"RTN 08FT03 p.292"},
{th:"circ",ty:"qcm",q:"Quand arrêter le refroidissement actif d’un coup de chaleur ?",o:["À la disparition des signes neurologiques et quand la température passe sous 39 °C","Dès que la victime parle","À 37 °C","Après 5 minutes"],a:0,x:"Les deux conditions ; ou 15 min si la température n’est pas mesurable (selon la fiche).",s:"RTN 08PR06 p.291"},
{th:"circ",ty:"vf",q:"Dans toutes les affections liées à la chaleur, on commence par un refroidissement passif.",a:true,x:"« Dans tous les cas : réaliser un refroidissement passif. »",s:"RTN 08PR06 p.291"},
{th:"circ",ty:"qcm",q:"Hypothermie : température définissant l’hypothermie accidentelle ?",o:["Moins de 35 °C","Moins de 36 °C","Moins de 34 °C","Moins de 32 °C"],a:0,x:"Chute involontaire de la température corporelle au-dessous de 35 °C.",s:"RTN 08AC06 p.294"},
{th:"circ",ty:"ordre",q:"Classe les stades d’hypothermie du moins grave au plus grave.",o:["Légère : 35-32 °C, frissons permanents","Modérée : 32-28 °C, plus de frissons, troubles de conscience","Sévère : 28-24 °C, PC, pouls difficile à percevoir","Grave : < 24 °C, arrêt cardiaque apparent"],x:"Repère : la disparition des frissons signe l’aggravation.",s:"RTN 08AC06 p.294"},
{th:"circ",ty:"vf",q:"Dans l’hypothermie sévère, les mobilisations de la victime peuvent déclencher un trouble du rythme voire un arrêt cardiaque.",a:true,x:"Victime très sensible à toutes les mobilisations : manipulations douces et horizontales.",s:"RTN 08AC06 p.294"},
{th:"circ",ty:"qcm",q:"Nouveau-né en bonne santé : quand clamper le cordon ?",o:["Au minimum après 1 minute de vie","Immédiatement","Après 10 minutes","Jamais en préhospitalier"],a:0,x:"Clamper au minimum après 1 minute ; couper ensuite possible.",s:"RTN 08PR05 p.283"},
{th:"circ",ty:"multi",q:"Nouveau-né à la naissance : premières actions (coche tout ce qui est juste) :",o:["Le poser peau contre peau sur le ventre de sa mère, sur le côté, tête dégagée","Apprécier cri/respiration et tonus","Sécher par tamponnement et couvrir la tête","Le suspendre par les pieds","Le laver à l’eau"],a:[0,1,2],x:"Aussi : couvrir la mère, surveiller ; transport dans un système fermé et fixé.",s:"RTN 08PR05 p.283"},
{th:"circ",ty:"vf",q:"Chez le nouveau-né qui ne respire pas malgré stimulation, on réalise 40 insufflations à l’air en 1 minute.",a:true,x:"Et si le thorax ne se soulève pas après les 5 premières, vérifier la liberté des VA et l’étanchéité du masque.",s:"RTN 08PR05 p.283"},
{th:"circ",ty:"qcm",q:"Intoxication au CO, victime consciente, SpO₂ 98 % :",o:["MHC 15 L/min quelle que soit la SpO₂","Pas d’O₂, SpO₂ normale","Lunettes 2 L/min","O₂ seulement si céphalées"],a:0,x:"Le saturomètre est faussé par le CO.",s:"RTN 05FT01 p.115"},
{th:"circ",ty:"vf",q:"Victime électrisée encore au contact du câble : tu la dégages rapidement avec tes gants de soin.",a:false,x:"Ne jamais toucher la victime avant la suppression du risque électrique.",s:"RTN 07PR01 p.204 · 08PR01"},
{th:"circ",ty:"expl",q:"Explique pourquoi l’absence de frissons chez un hypotherme est inquiétante.",k:["Les frissons produisent de la chaleur","Ils disparaissent quand l’hypothermie s’aggrave","Stade modéré ou plus (< 32 °C)","Risque de trouble du rythme"],x:"Le frisson, c’est le corps qui se défend en produisant de la chaleur. Quand il s’arrête, ce n’est pas qu’il va mieux : c’est qu’il est passé sous 32 °C environ et ne se défend plus. Le cœur devient fragile, on manipule doucement.",s:"RTN 08AC06 p.294-295"},

/* ================= SITUATIONS PARTICULIÈRES & NOVI ================= */
{th:"situ",ty:"multi",q:"Situations où les SP n’engagent pas de gestes de secours (coche tout ce qui est juste) :",o:["Tête séparée du tronc","Raideur cadavérique ou putréfaction","Refus de la famille invoquant le non-acharnement thérapeutique","ACR au milieu de nombreuses victimes nécessitant des gestes de survie, moyens insuffisants","ACR sans témoin depuis une durée inconnue"],a:[0,1,2,3],x:"Plus : danger imminent et impossibilité de soustraire la victime. L’ACR de durée inconnue se réanime.",s:"GDO SSUAP §3.1 p.52"},
{th:"situ",ty:"qcm",q:"Personne en crise psychiatrique devant être hospitalisée sans consentement :",o:["La présence physique d’un médecin et son examen sont indispensables avant tout transport","Le chef d’agrès peut décider seul du transport","La police suffit pour décider","La famille signe et on part"],a:0,x:"Le CA contacte le SAMU pour qu’il engage un médecin.",s:"GDO SSUAP §3.3 p.53"},
{th:"situ",ty:"vf",q:"La contention physique d’une personne agitée et dangereuse relève des forces de l’ordre.",a:true,x:"Dans l’attente, maintien provisoire possible pour sa sécurité ou celle des autres.",s:"GDO SSUAP §3.10 p.58"},
{th:"situ",ty:"multi",q:"Abord d’une personne présentant des troubles du comportement (coche tout ce qui est juste) :",o:["Ne pas prolonger ni soutenir le regard, ne pas la contredire","Questions ouvertes, éviter les « pourquoi »","Suivre son rythme, l’amener à venir vers les secours","Dire ce que l’on fait et faire ce que l’on dit","Se précipiter vers elle pour la rassurer"],a:[0,1,2,3],x:"Aussi : isoler l’entourage aggravant, maintenir les présences apaisantes, voix posée.",s:"GDO SSUAP §3.10 p.58"},
{th:"situ",ty:"ordre",q:"Personne ne répondant pas aux appels : remets dans l’ordre.",o:["Confirmer le logement et le motif de l’appel","Recueillir des éléments (antécédents, armes…) sans sonner ni appeler","Solliciter les forces de sécurité publique","Accéder de préférence par une fenêtre, en s’annonçant","Reconnaître toutes les pièces, rangements, garage, cave, voiture"],x:"Ne pas sonner, ne pas faire appeler, ne pas rester devant la porte.",s:"GDO SSUAP §3.12 p.60"},
{th:"situ",ty:"qcm",q:"Personne qui ne répond pas : pour pénétrer, tu privilégies…",o:["Une fenêtre, une cuisine plutôt qu’une chambre","La porte d’entrée","La chambre, la victime y est souvent","Le toit"],a:0,x:"Fenêtre plutôt que porte d’entrée, cuisine plutôt que chambre.",s:"GDO SSUAP §3.12 p.60"},
{th:"situ",ty:"vf",q:"Une personne en état d’ivresse publique et manifeste prise en charge par les SP doit systématiquement bénéficier d’un bilan complet.",a:true,x:"Ne pas tomber dans la routine : évolution possible vers une détresse vitale et une mort subite.",s:"GDO SSUAP §3.7 p.56"},
{th:"situ",ty:"qcm",q:"Doute de violences conjugales sur intervention, la victime nie. Au retour :",o:["Tu consignes les éléments dans le compte-rendu et en rends compte à ton supérieur en vue d’un éventuel signalement","Tu n’en parles à personne, secret oblige","Tu appelles le conjoint pour en discuter","Tu publies une note au CIS"],a:0,x:"Compte-rendu de sortie et compte rendu hiérarchique.",s:"GDO SSUAP §3.4 p.54"},
{th:"situ",ty:"multi",q:"Victime en situation de handicap (coche tout ce qui est juste) :",o:["S’adresser directement à elle","Lui demander comment l’aider","Ne pas toucher l’animal d’assistance","Demander la permission avant de toucher son fauteuil (hors urgence)","Parler à l’accompagnant plutôt qu’à elle"],a:[0,1,2,3],x:"Ne pas présumer du handicap (certains sont invisibles).",s:"GDO SSUAP §3.9 p.57"},
{th:"situ",ty:"qcm",q:"Mineur seul, blessé léger, ne nécessitant pas d’évacuation :",o:["Le confier au représentant légal, aux forces de l’ordre ou à un adulte en ayant la garde ; à défaut, contacter le régulateur","Le laisser rentrer seul s’il habite près","L’emmener au CIS","Le confier à un passant majeur"],a:0,x:"Représentant légal, forces de l’ordre, adulte en ayant la garde (entraîneur, enseignant…). À défaut, régulateur.",s:"GDO SSUAP §3.6 p.55"},
{th:"situ",ty:"vf",q:"Sur une scène de crime, les soins à la victime autorisent la modification de l’état des lieux.",a:true,x:"Article 55 CPP : exception pour les soins aux victimes. Limiter les intervenants, cheminement unique, mémoriser.",s:"GDO SSUAP §4 p.61-62"},
{th:"situ",ty:"vf",q:"En situation d’urgence, la victime peut exiger le choix de son praticien et refuser un secouriste pour motif religieux, sans formalité.",a:false,x:"Le droit de choisir son praticien ne s’applique pas en urgence. Un refus de prise en charge reste possible (on ne contraint pas) mais avec formulaire de refus de soins.",s:"GDO SSUAP §3.15 p.61"},
{th:"situ",ty:"qcm",q:"Le repérage des victimes en situation de nombreuses victimes se déclenche quand :",o:["Le nombre de victimes apparemment graves est supérieur au nombre de secouristes présents","Il y a plus de 10 victimes","Le plan rouge est déclenché","Le SAMU le demande"],a:0,x:"Indication de la fiche repérage.",s:"RTN 11FT01 p.375"},
{th:"situ",ty:"qcm",q:"Repérage : victime qui a perdu connaissance, VA libérées, respire. Couleur ?",o:["Rouge (PLS, couvrir, laisser sur place)","Jaune","Noir","Vert"],a:0,x:"PDC qui respire → PLS → rouge.",s:"RTN 11FT01 p.376"},
{th:"situ",ty:"qcm",q:"Repérage : victime consciente, sans détresse vitale, incapable de se déplacer. Couleur ?",o:["Jaune (laisser dans sa position)","Vert","Rouge","Noir"],a:0,x:"Incapacité à se déplacer → jaune ; sinon vert au PRV.",s:"RTN 11FT01 p.376"},
{th:"situ",ty:"ordre",q:"Arbre de repérage nombreuses victimes : remets les questions dans l’ordre.",o:["Le décès fait-il un doute ?","Hémorragie ?","Perte de connaissance ?","Détresse vitale ?","Incapacité à se déplacer ?"],x:"Rechercher (décès, hémorragie, PC) puis apprécier (détresse, déplacement).",s:"RTN 11FT01 p.376"},
{th:"situ",ty:"qcm",q:"Repérage : PC, VA libérées, ne respire pas. Couleur ?",o:["Noir","Rouge","Jaune","On débute la RCP et on reste"],a:0,x:"En situation de nombreuses victimes, ne respire pas après LVA → noir.",s:"RTN 11FT01 p.376"},
{th:"situ",ty:"multi",q:"Le « damage control » consiste à (coche tout ce qui est juste) :",o:["Arrêter les grandes hémorragies","Sécuriser les voies aériennes","Assurer la survie sans traiter définitivement toutes les lésions","Immobiliser chaque fracture avant de passer à la suivante"],a:[0,1,2],x:"Le traitement médical définitif est différé de quelques heures.",s:"GDO SSUAP §5 p.64"},
{th:"situ",ty:"qcm",q:"À quoi sert SINUS en situation de nombreuses victimes ?",o:["Attribuer un numéro unique à chaque victime : exhaustivité, pas de doublon, traçabilité","Calculer le nombre de VSAV","Joindre les familles","Géolocaliser les engins"],a:0,x:"Système d’information numérique standardisé : bracelets, recueil terrain, base nationale.",s:"GDO SSUAP §5.2 p.65-66"},
{th:"situ",ty:"qcm",q:"Premier engin sur une situation à nombreuses victimes : impliqués et blessés légers sont…",o:["Regroupés dans un lieu différent de celui des blessés graves","Laissés au contact des blessés graves pour aider","Renvoyés chez eux","Transportés en premier"],a:0,x:"Premier tri : décédés laissés sur place, blessés graves → gestes de survie, légers et impliqués regroupés ailleurs.",s:"GDO SSUAP §5 p.63"},
{th:"situ",ty:"expl",q:"Explique pourquoi, en situation de nombreuses victimes, on ne réanime pas un arrêt cardiaque.",k:["Les moyens sont insuffisants","La RCP mobilise des secouristes pendant longtemps","D’autres victimes ont besoin de gestes de survie simples","Faire le plus de bien au plus grand nombre"],x:"Une RCP bloque deux secouristes pour un pronostic faible, pendant que d’autres victimes vont mourir faute d’un garrot ou d’une PLS. Quand les moyens manquent, on fait le plus de bien au plus grand nombre.",s:"GDO SSUAP §3.1 p.52 · RTN 11FT01"}

  {t:"Remercier l’épouse et lui faire raconter les antécédents",v:1,f:"Important, mais après : on ne laisse pas la RCP s’arrêter pour l’interrogatoire."}]},
 {q:"Le DAE annonce « choc recommandé », choc délivré. Ensuite ?",o:[
  {t:"Reprendre les compressions immédiatement, sans attendre la voix du DAE",v:2,f:"Reprise immédiate après la délivrance, ou non, du choc."},
  {t:"Rechercher un pouls pour voir si le choc a marché",v:0,f:"On ne s’arrête pas : la circulation dépend des compressions, le DAE réanalysera."},
  {t:"Attendre les consignes vocales pour ne pas faire d’erreur",v:0,f:"Le RTN 2026 est clair : on reprend sans attendre."}]},
 {q:"Tes compressions : quels repères ?",o:[
  {t:"Moitié inférieure du sternum, ≈ 5 cm, 100-120/min, relâchement complet, relais toutes les 2 min pendant l’analyse",v:2,f:"Exactement les repères de la fiche compressions."},
  {t:"Le plus fort et le plus vite possible, au moins 140/min",v:0,f:"Au-delà de 120 le cœur se remplit mal ; on vise 100-120."},
  {t:"Centre du thorax, 3 cm, pour ne pas casser les côtes",v:0,f:"Trop superficiel : un tiers du thorax, environ 5 cm."}]},
 {q:"Le patient bouge, ouvre les yeux, respire. Que fais-tu ?",o:[
  {t:"Arrêter la RCP, garder strictement allongé, électrodes en place, bilan depuis le 2e regard, prêt à reprendre",v:2,f:"Récidive fréquente : on garde le DAE en place et on surveille en permanence."},
  {t:"Le mettre en PLS et retirer les électrodes",v:0,f:"On garde les électrodes : le risque de récidive est majeur."},
  {t:"L’asseoir pour l’aider à respirer",v:0,f:"Strictement allongé."}]},
 {q:"L’épouse est en larmes dans le couloir. Que prévoit le RTN ?",o:[
  {t:"Sans retarder les soins, un membre de l’équipe évalue son état émotionnel, la rassure et valorise son massage",v:2,f:"C’est prévu dans la CAT en équipe."},
  {t:"La faire sortir de la maison",v:0,f:"Ce n’est pas un soutien."},
  {t:"Rien : on se concentre sur la victime",v:1,f:"La victime d’abord, oui, mais le témoin fait partie de la prise en charge dès que possible."}]}
]},
{t:"Hémorragie sur chantier",tag:"Hémorragie · garrot",
intro:"14 h, chantier. Ouvrier de 35 ans, plaie de la face antérieure de cuisse par disqueuse, sang abondant. Un collègue comprime avec un chiffon déjà imbibé. Victime pâle, angoissée, consciente.",
st:[
 {q:"Premier geste ?",o:[
  {t:"Gants, constater, faire maintenir ou reprendre la compression, allonger la victime",v:2,f:"Compression immédiate et allongement qui retarde la détresse."},
  {t:"Garrot d’emblée à la racine de la cuisse",v:0,f:"Le garrot vient si la compression est inefficace ou impossible, et à 5-7 cm de la plaie, pas à la racine par principe."},
  {t:"Bilan complet avant tout geste",v:0,f:"Hémorragie = menace vitale du 2e regard : on agit d’abord."}]},
 {q:"Le sang continue à traverser malgré la compression. Tu :",o:[
  {t:"Poses un garrot à 5-7 cm au-dessus de la plaie, entre plaie et racine, hors articulation, et notes l’heure",v:2,f:"Compression inefficace → garrot en zone garrotable."},
  {t:"Ajoutes des compresses par-dessus et attends",v:0,f:"Saignement persistant : on passe au garrot."},
  {t:"Poses un garrot élastique de prise de sang",v:0,f:"Interdit : il ne faut pas utiliser les garrots élastiques."}]},
 {q:"FC 128, PA 92/60, TRC 3 s, SpO₂ 95 %. Ensuite ?",o:[
  {t:"Allongé à plat, O₂ MHC, couverture, demande de SMUR, surveillance toutes les 5 min",v:2,f:"Détresse circulatoire en constitution : position, O₂, réchauffer, renfort médical, paramètres toutes les 5 min."},
  {t:"Le faire asseoir pour mieux le surveiller",v:0,f:"Il doit rester à plat."},
  {t:"Pas d’O₂ car SpO₂ à 95 %",v:1,f:"La détresse circulatoire est une indication de l’O₂."}]},
 {q:"Le SMUR arrive dans 20 min et l’équipier propose de desserrer le garrot « pour ne pas abîmer la jambe ». Tu :",o:[
  {t:"Refuses : un garrot ne se desserre que sur ordre médical",v:2,f:"C’est la règle."},
  {t:"Desserres 1 minute puis resserres",v:0,f:"Risque de reprise hémorragique majeure."},
  {t:"Remplaces par un pansement compressif",v:0,f:"Même logique : desserrage sur ordre médical uniquement."}]}
]},
{t:"Gêne respiratoire chez un BPCO",tag:"Détresse respiratoire · O₂",
intro:"Appartement, homme de 74 ans BPCO sous 1,5 L/min d’O₂ à domicile. Essoufflement majoré depuis 2 jours, toux. Assis au bord du lit, parle par phrases courtes.",
st:[
 {q:"Installation ?",o:[
  {t:"Le laisser assis ou demi-assis, desserrer, masque chirurgical car il tousse",v:2,f:"Position de confort respiratoire et précautions infectieuses."},
  {t:"L’allonger à plat pour la PA",v:0,f:"Une victime en gêne respiratoire s’installe assise ou demi-assise."},
  {t:"PLS",v:0,f:"Il est conscient."}]},
 {q:"FR 30, SpO₂ 84 % sous ses 1,5 L/min. Oxygène ?",o:[
  {t:"Augmenter de 1 à 2 L/min aux lunettes, cible 89-94 %, avis médical",v:2,f:"IRC : débit habituel + 1-2 L/min, objectif 89-94 %."},
  {t:"MHC 15 L/min jusqu’à 98 %",v:0,f:"Risque d’hyperoxie chez l’IRC avancé."},
  {t:"Ne rien changer, il a son traitement",v:0,f:"SpO₂ < 89 % chez l’IRC : indication."}]},
 {q:"Après 10 minutes, il devient somnolent malgré une SpO₂ remontée à 96 %. Lecture ?",o:[
  {t:"Aggravation neurologique : réévaluer, reprendre l’avis médical immédiatement, revoir le débit (cible dépassée)",v:2,f:"Toute modification de l’état → gestes adaptés et transmission. SpO₂ au-dessus de la cible chez un IRC."},
  {t:"Il se repose, tout va bien, la SpO₂ est bonne",v:0,f:"La clinique prime : une somnolence nouvelle est une aggravation."},
  {t:"Monter à 15 L/min",v:0,f:"Contre-productif ici."}]}
]},
{t:"AVC au supermarché",tag:"AVC · FAST · glycémie",
intro:"10 h 30, supermarché. Femme de 68 ans, la caissière l’a vue « parler bizarrement » depuis 10 h 05. Assise sur une chaise, consciente.",
st:[
 {q:"Tes tests au bilan ?",o:[
  {t:"FAST : sourire, bras tendus yeux fermés 10 s, répéter une phrase ; et l’heure de début",v:2,f:"Une anomalie suffit pour un FAST positif. L’heure de début est capitale."},
  {t:"Glasgow complet seulement",v:1,f:"Utile, mais il manque le test de reconnaissance de l’AVC."},
  {t:"Lui faire marcher quelques pas",v:0,f:"Inutile et à risque de chute."}]},
 {q:"Position ?",o:[
  {t:"Strictement allongée à plat (PLS si nausées/vomissements)",v:2,f:"Position recommandée par la procédure AVC."},
  {t:"Demi-assise",v:0,f:"Non pour l’AVC."},
  {t:"Assise, elle est bien sur sa chaise",v:0,f:"On l’allonge."}]},
 {q:"Paramètres : SpO₂ 97 %, PA 175/95. Que fais-tu de plus ?",o:[
  {t:"Glycémie capillaire, traitements (anticoagulants ?), avis médical rapide, pas d’O₂",v:2,f:"Glycémie systématique au 4e regard ; O₂ inutile si SpO₂ normale (l’hyperoxie peut nuire)."},
  {t:"O₂ 15 L/min pour protéger le cerveau",v:0,f:"Pas d’indication si SpO₂ ≥ 94 %."},
  {t:"Lui donner du sucre au cas où",v:0,f:"Sucre seulement si glycémie < 0,6 g/L ou malaise de diabétique d’origine inconnue, et victime capable d’avaler."}]},
 {q:"Destination ?",o:[
  {t:"Celle que fixe le régulateur, idéalement une unité neurovasculaire",v:2,f:"Orientation par le régulateur, vers USINV/UNV."},
  {t:"Le CH le plus proche d’office",v:0,f:"Pas forcément adapté."},
  {t:"La clinique choisie par sa fille",v:0,f:"Le libre choix est limité par l’adaptation de la structure."}]}
]},
{t:"Accident de scooter",tag:"Traumatisme · rachis · bassin",
intro:"Route départementale, 18 h. Scooter contre voiture à environ 50 km/h. Le conducteur du scooter, 19 ans, est allongé à 5 m, casque intégral en place, conscient, gémit. Il se plaint du bassin.",
st:[
 {q:"1er regard : ta priorité ?",o:[
  {t:"Balisage et sécurité, nombre de victimes (passager ? automobiliste ?), moyens complémentaires",v:2,f:"Dangers, nombre de victimes, demande précoce de moyens."},
  {t:"Courir vers la victime",v:0,f:"Sur-accident : le 1er regard d’abord."},
  {t:"Retirer immédiatement le casque",v:1,f:"Le retrait du casque se fait au 2e regard si VA menacées, ou ensuite ; d’abord la sécurité."}]},
 {q:"Il est conscient, VA libres, respire. Casque ?",o:[
  {t:"Le retirer à deux, maintien de la tête, puis stabilisation du rachis",v:2,f:"Traumatisme du dos/cou et du crâne : retirer le casque s’il est encore présent."},
  {t:"Le laisser jusqu’à l’hôpital",v:0,f:"Le référentiel prévoit le retrait."},
  {t:"Le faire retirer par la victime",v:0,f:"Mouvements du rachis non contrôlés."}]},
 {q:"FC 130, PA 85/50, pâle, douleur pelvienne intense. Rachis et bassin ?",o:[
  {t:"Réponses non fiables (détresse, douleur distrayante) + haut risque : immobilisation corps entier ; bassin + détresse : contention pelvienne après avis, matelas à dépression",v:2,f:"Arbre rachis + procédure bassin."},
  {t:"Pas d’immobilisation, il répond bien",v:0,f:"Détresse vitale et douleur distrayante = réponses non fiables."},
  {t:"Tester la mobilité du bassin en le comprimant",v:0,f:"On ne teste pas : on dénude, on regarde, on contient si indiqué."}]},
 {q:"Transmission ?",o:[
  {t:"Demande de SMUR sans délai : nature, motif (détresse circulatoire), sexe et âge ; bilan complet ensuite",v:2,f:"Détresse vitale : renfort médical immédiat, bilan complet dans un second temps."},
  {t:"Attendre d’avoir tous les paramètres et antécédents",v:0,f:"Trop tard sur une détresse."},
  {t:"Appeler directement les urgences de l’hôpital",v:0,f:"La transmission passe par la régulation."}]}
]},
{t:"Hypoglycémie… ou ivresse ?",tag:"Troubles du comportement · glycémie",
intro:"Gare, 23 h. Homme d’une cinquantaine d’années, agressif, propos incohérents, odeur d’alcool. Les passants disent « il est saoul ». Un bracelet au poignet.",
st:[
 {q:"Sécurité d’abord : ta posture ?",o:[
  {t:"Distance, attitude calme et ferme, mains visibles, forces de l’ordre si besoin, CA informé",v:2,f:"Prévention du risque agression, communication non violente."},
  {t:"L’attraper pour le faire asseoir",v:0,f:"Risque d’escalade ; la contention relève des forces de l’ordre."},
  {t:"Partir, c’est une IPM",v:0,f:"Toute IPM fait l’objet d’un bilan complet."}]},
 {q:"Le bracelet indique « diabétique sous insuline ». Ton geste clé ?",o:[
  {t:"Glycémie capillaire dès que possible",v:2,f:"Troubles du comportement = indication de la glycémie."},
  {t:"Éthylotest",v:0,f:"Pas un geste SUAP."},
  {t:"Le laisser cuver sur un banc",v:0,f:"Une hypoglycémie peut évoluer vers une détresse."}]},
 {q:"Glycémie 0,38 g/L, il avale. Tu :",o:[
  {t:"Lui fais prendre 4 morceaux de sucre, avis médical, réévaluation à 15 min",v:2,f:"Conduite à tenir hypoglycémie consciente capable d’avaler."},
  {t:"Lui donnes 1 sucre, ça suffit",v:0,f:"Adulte : 4 morceaux ou cuillères à café."},
  {t:"Attends qu’il perde connaissance pour agir",v:0,f:"On corrige pendant qu’il peut avaler."}]}
]},
{t:"Porte close, voisine inquiète",tag:"Personne ne répondant pas",
intro:"Immeuble, 9 h. Une voisine n’a pas vu Mme R., 84 ans, depuis deux jours. Volets fermés, téléalarme déclenchée selon le CTA.",
st:[
 {q:"À l’arrivée, tu :",o:[
  {t:"Confirmes le logement et le motif, recueilles les antécédents, sans sonner ni appeler, et sollicites les forces de l’ordre",v:2,f:"Principes du GDO pour les personnes ne répondant pas."},
  {t:"Sonnes longuement et appelles son téléphone",v:0,f:"Proscrit : on ne sonne pas, on ne fait pas appeler."},
  {t:"Enfonces la porte palière tout de suite",v:0,f:"On privilégie une fenêtre à la porte d’entrée."}]},
 {q:"Comment entres-tu ?",o:[
  {t:"Par une fenêtre si possible (cuisine plutôt que chambre), en t’annonçant à chaque étape",v:2,f:"C’est la règle du GDO."},
  {t:"Par la porte d’entrée par principe",v:0,f:"Fenêtre privilégiée."},
  {t:"Par la chambre pour la trouver plus vite",v:0,f:"Cuisine plutôt que chambre."}]},
 {q:"Pièces visitées, personne. Tu :",o:[
  {t:"Poursuis la reconnaissance : placards, garage, cave, abri de jardin, voiture",v:2,f:"Reconnaissance approfondie."},
  {t:"Conclus qu’elle est absente",v:0,f:"Trop tôt."},
  {t:"Repars en laissant un mot",v:0,f:"Reconnaissance incomplète."}]}
]},
{t:"Bus couché, plus de victimes que de secouristes",tag:"NOVI · repérage",
intro:"Car scolaire couché dans un fossé. Vous êtes le premier VSAV (3 SP). Une trentaine de personnes, des cris, plusieurs au sol.",
st:[
 {q:"Premier message ?",o:[
  {t:"Situation à nombreuses victimes, nombre approximatif et gravité apparente, moyens demandés, PRM et PRV provisoires",v:2,f:"Transmettre sans délai : le dénombrement fonde les renforts."},
  {t:"Rien avant d’avoir vu toutes les victimes",v:0,f:"On transmet tout de suite."},
  {t:"Demander juste un deuxième VSAV",v:0,f:"Sous-dimensionné."}]},
 {q:"Méthode de repérage ?",o:[
  {t:"Victime la plus proche d’abord, une à une, critères simples, couleur, on passe à la suivante",v:2,f:"Fiche repérage nombreuses victimes."},
  {t:"Commencer par celle qui crie le plus",v:0,f:"Celle qui crie respire."},
  {t:"Bilan complet de chaque victime",v:0,f:"Trop long : critères simples."}]},
 {q:"Un adolescent a perdu connaissance et ne respire pas après LVA.",o:[
  {t:"Noir, on passe à la suivante",v:2,f:"Arbre de repérage : ne respire pas après LVA → noir."},
  {t:"RCP jusqu’à l’arrivée du SMUR",v:0,f:"Moyens insuffisants et autres victimes à sauver."},
  {t:"PLS et rouge",v:0,f:"Il ne respire pas."}]},
 {q:"Une enfant saigne abondamment de l’avant-bras.",o:[
  {t:"Traiter l’hémorragie, puis continuer l’arbre",v:2,f:"Hémorragie → traiter, c’est le seul geste avant de catégoriser."},
  {t:"La classer jaune et continuer",v:0,f:"Une hémorragie se traite immédiatement."},
  {t:"L’évacuer immédiatement dans le VSAV",v:0,f:"Le premier engin repère et organise."}]}
]}
];

<script>
(function(){
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g,"");
const norm = s => strip(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const CHAP = Object.fromEntries(CHAPITRES);
const KEY = "revisionsSUAP_v1";

/* ---------- Stockage (propre à ce navigateur) ---------- */
const BLANK = ()=>({q:{},cas:{},installDismissed:false,days:[],fm:{},fv:{},fdj:null,lastDaily:null,mm:{},mh:false,lastExport:null,cert:true});
let S = BLANK();
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function hash(str){ let h=5381; for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;} return "q"+(h>>>0).toString(36); }
QUIZ.forEach(q=>{ q.id = hash(q.ty+"|"+q.q); });

/* ---------- Jours, régularité, répétition espacée ---------- */
const DAYMS = 86400000;
function today(){ const n=new Date(); return Math.round(new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime()/DAYMS); }
function markDay(){ const t=today(); if(!Array.isArray(S.days)) S.days=[]; if(!S.days.includes(t)){ S.days.push(t); if(S.days.length>400) S.days=S.days.slice(-400); updateChip(); } }
function streak(){ const set=new Set(S.days||[]); let t=today(); if(!set.has(t)) t--; let n=0; while(set.has(t)){ n++; t--; } return n; }
/* Boîtes de Leitner : 1, 3, 7, 14, 30, 60 jours. Le degré de certitude module l’avancée. */
const GAPS=[0,1,3,7,14,30,60];
function boxOf(r){ return r ? (r.box!=null ? r.box : 0) : -1; }
function dueList(){ const t=today(); return QUIZ.filter(q=>{ const r=S.q[q.id]; return r && r.due!=null && r.due<=t; }); }
function freshList(){ return QUIZ.filter(q=>!S.q[q.id]); }
function dangerList(){ return QUIZ.filter(q=>S.q[q.id] && S.q[q.id].dz); }
const DAILY_N = 15;
function dailyPool(){
  const t=today();
  /* priorité : erreurs commises avec certitude, puis révisions dues (boîtes basses d’abord), puis nouvelles */
  const dz = shuffle(dangerList().filter(q=>(S.q[q.id].due||0)<=t));
  const due = shuffle(dueList().filter(q=>!dz.includes(q))).sort((a,b)=>boxOf(S.q[a.id])-boxOf(S.q[b.id]));
  const fresh = shuffle(freshList());
  let l = dz.concat(due).slice(0, fresh.length ? DAILY_N-4 : DAILY_N);
  l = l.concat(fresh.slice(0, DAILY_N-l.length));
  if(l.length<DAILY_N){ const rest = QUIZ.filter(q=>!l.includes(q)).sort((a,b)=>((S.q[a.id]||{}).due||0)-((S.q[b.id]||{}).due||0)); l = l.concat(rest.slice(0,DAILY_N-l.length)); }
  /* entrelacement : au moins 2 décisions et 1 explication par séance */
  const ensure=(ty,n)=>{ let have=l.filter(q=>q.ty===ty).length; if(have>=n) return; const cand=shuffle(QUIZ.filter(q=>q.ty===ty && !l.includes(q))).sort((a,b)=>((S.q[a.id]||{}).due||-1)-((S.q[b.id]||{}).due||-1));
    for(let i=0;i<cand.length && have<n;i++){ const k=l.findIndex(q=>q.ty!=="lance"&&q.ty!=="expl"&&!dz.includes(q)&&!(S.q[q.id]&&S.q[q.id].last===false)); if(k<0) break; l[k]=cand[i]; have++; } };
  ensure("lance",2); ensure("expl",1);
  /* éviter deux questions du même thème d’affilée */
  l = shuffle(l); for(let i=1;i<l.length;i++){ if(l[i].th===l[i-1].th){ const j=l.findIndex((q,k)=>k>i && q.th!==l[i-1].th && (k+1>=l.length || l[k+1].th!==l[i].th)); if(j>0){ [l[i],l[j]]=[l[j],l[i]]; } } }
  return l;
}
function statsFor(list){
  let seen=0, ok=0, mastered=0, sure=0, sureOk=0;
  list.forEach(q=>{ const r=S.q[q.id]; if(r){ seen++; if(r.last) ok++; if(r.box>=3 && r.last) mastered++; sure+=r.s||0; sureOk+=r.so||0; } });
  return {total:list.length, seen, ok, mastered, sure, sureOk};
}
function chapPct(k){ const l=QUIZ.filter(q=>q.th===k); const s=statsFor(l); return {n:l.length, seen:s.seen, p: l.length? Math.round(s.ok/l.length*100):0, pSeen: s.seen? Math.round(s.ok/s.seen*100):null}; }
function errorsList(){ return QUIZ.filter(q=>S.q[q.id] && S.q[q.id].last===false); }
function ficheDuJour(){
  const t=today();
  if(S.fdj && S.fdj.d===t && FICHES.some(f=>f.id===S.fdj.id)) return FICHES.find(f=>f.id===S.fdj.id);
  const prev = S.fdj ? S.fdj.id : null;
  const rank = f => { const m=S.fm[f.id]; return m===-1?0 : (S.fv[f.id]==null?1 : (m===1?3:2)); };
  const cp = {}; CHAPITRES.forEach(([k])=>cp[k]=chapPct(k).p);
  const list = shuffle(FICHES.filter(f=>f.id!==prev)).sort((a,b)=> rank(a)-rank(b) || (S.fv[a.id]??-1)-(S.fv[b.id]??-1) || cp[a.ch]-cp[b.ch]);
  const f = list[0]; S.fdj={d:t,id:f.id}; save(); return f;
}
function casAuHasard(){
  const idx = CAS.map((_,i)=>i);
  const unplayed = idx.filter(i=>S.cas[i]==null);
  if(unplayed.length) return shuffle(unplayed)[0];
  const sorted = shuffle(idx).sort((a,b)=>S.cas[a]-S.cas[b]);
  return sorted[Math.floor(Math.random()*Math.min(3,sorted.length))];
}

/* ---------- Installation (PWA) ---------- */
let deferredPrompt = null;
const standalone = () => { try{ return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; }catch(e){ return false; } };
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if(cur.tab==="accueil") render(); });
window.addEventListener("appinstalled", () => { S.installDismissed = true; save(); toast("Appli installée"); if(cur.tab==="accueil") render(); });

function updateChip(){ const el = $("#chipJ"); if(!el) return; const n = streak(); el.textContent = n ? "Série "+n+" j" : "À toi de jouer"; }

/* ---------- Routage ---------- */
let cur = {tab:"accueil"};
const TABS = ["accueil","memo","fiches","quiz","cas","outils","chiffres","lexique","methode","sauvegarde"];
const NAVOF = {chiffres:"outils",lexique:"outils",methode:"outils",sauvegarde:"outils"};
function go(tab, extra){
  cur = Object.assign({tab}, extra||{});
  stopTimer(); if(LB){ LB=null; drawLb(); }
  if(location.hash !== "#"+tab){ try{ history.replaceState(null,"","#"+tab); }catch(e){ location.hash = tab; } }
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", ()=>{ const t=location.hash.slice(1); if(TABS.includes(t) && t!==cur.tab) go(t); });
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===(NAVOF[cur.tab]||cur.tab)?"page":"false"));
  updateChip();
  const v = $("#view");
  if(cur.tab==="accueil") v.innerHTML = vAccueil();
  else if(cur.tab==="fiches") v.innerHTML = cur.id ? vFiche(cur.id) : vFiches();
  else if(cur.tab==="quiz") v.innerHTML = cur.run ? vQuestion() : (cur.result ? vResult() : vQuizSetup());
  else if(cur.tab==="cas") v.innerHTML = cur.cas!=null ? vCas() : vCasList();
  else if(cur.tab==="memo") v.innerHTML = cur.memo ? vMemo(cur.memo) : vMemoList();
  else if(cur.tab==="outils") v.innerHTML = vOutils();
  else if(cur.tab==="methode") v.innerHTML = backOutils + vMethode();
  else if(cur.tab==="sauvegarde") v.innerHTML = vSauvegarde();
  else if(cur.tab==="chiffres") v.innerHTML = backOutils + vChiffres();
  else if(cur.tab==="lexique") v.innerHTML = backOutils + vLexique();
  bind();
  linkify(v);
}

/* ---------- Accueil ---------- */
function vAccueil(){
  const st = statsFor(QUIZ);
  const err = errorsList().length; const dz = dangerList().length;
  const t = today(); const due = dueList().length; const fresh = freshList().length;
  const n = streak(); const set = new Set(S.days||[]);
  let html = "";
  if(!standalone() && !S.installDismissed){
    html += `<section class="install" aria-labelledby="instT">
      <div class="ic" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></div>
      <div><h3 id="instT">Installer l’appli sur ton téléphone</h3>
      <p>Pour l’ouvrir d’un geste, comme une vraie appli, en garde ou entre deux interventions. Elle marche aussi hors réseau.</p>
      ${deferredPrompt ? `<div class="row"><button class="btn primary" data-act="install">Installer l’appli</button><button class="btn ghost" data-act="dismiss">Plus tard</button></div>`
      : `<ol><li>Sur Android (Chrome, Samsung Internet) : menu <b>⋮</b> puis <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.</li><li>Sur iPhone (Safari) : bouton <b>Partager</b> puis <b>Sur l’écran d’accueil</b>.</li></ol>
      <div class="row"><button class="btn primary" data-act="dismiss">C’est fait</button><button class="btn ghost" data-act="dismiss">Plus tard</button></div>`}
      </div></section>`;
  }
  let dots=""; for(let i=13;i>=0;i--){ const d=t-i; dots += `<i class="${set.has(d)?"on":""} ${i===0?"now":""}" title="${i===0?"Aujourd’hui":"Il y a "+i+" j"}"></i>`; }
  html += `<section class="hero"><div class="band"></div><div class="in">
      <div><div class="eyebrow">Équipier SUAP · formateur PSE</div><h2>Rester à 100 % en SUAP</h2><p class="muted" style="margin:6px 0 0">Un peu chaque jour : chaque question revient juste avant que tu l’oublies.</p></div>
      <div class="count"><b>${n}</b><span>${n>1?"jours d’affilée":"jour d’affilée"}</span></div></div>
      <div style="padding:0 16px 14px"><div class="dots" aria-label="Tes 14 derniers jours">${dots}</div></div></section>`;
  const doneToday = S.lastDaily===t;
  html += `<section class="today-card ${doneToday?"done":""}"><div class="eyebrow">${doneToday?"Séance du jour faite":"Séance du jour"}</div>
      <h3>${doneToday ? (due? "Encore "+due+" question"+(due>1?"s":"")+" à revoir" : "Séance faite, bravo") : DAILY_N+" questions mélangées, 6 minutes"}</h3>
      <p class="sub">${due} à revoir aujourd’hui · ${fresh} jamais vue${fresh>1?"s":""}${dz?` · <b style="color:var(--bad)">${dz} piège${dz>1?"s":""} de confiance</b>`:""} · thèmes mélangés, au moins 2 décisions de banc.</p>
      <div class="row"><button class="btn ${doneToday?"":"primary"}" data-act="daily">${doneToday?"Refaire une séance":"Lancer ma séance"}</button></div></section>`;
  const f = ficheDuJour();
  const m = S.fm[f.id];
  html += `<button class="fdj" data-fiche="${f.id}"><div class="eyebrow">Fiche du jour · ${esc(CHAP[f.ch])}${m===-1?' <span class="fstat rw">à retravailler</span>':(S.fv[f.id]==null?' <span class="fstat rw" style="background:var(--mark-soft);color:var(--ink)">jamais lue</span>':"")}</div><b>${esc(f.t)}</b><span class="c">${esc(strip(f.cle))}</span></button>`;
  html += `<section class="quick" aria-label="Raccourcis">
      <button class="hot" data-act="banc"><b>Banc de décision</b><span>Position, O₂, action prioritaire : ${QUIZ.filter(q=>q.ty==="lance").length} situations</span></button>
      <button data-act="cas-random"><b>Mise en situation</b><span>Tu es dans l’équipage VSAV, chaque choix compte</span></button>
      <button data-act="danger" ${dz?"":"disabled"}><b>Pièges de confiance</b><span>${dz?dz+" erreur"+(dz>1?"s":"")+" faite"+(dz>1?"s":"")+" en étant sûr":"Aucune pour l’instant"}</span></button>
      <button data-act="errors" ${err?"":"disabled"}><b>Mes erreurs</b><span>${err?err+" question"+(err>1?"s":"")+" à retravailler":"Rien à revoir pour l’instant"}</span></button>
      <button data-act="training"><b>Quiz libre</b><span>Par thème, correction immédiate</span></button>
      <button data-act="exam"><b>Examen blanc</b><span>30 questions, 40 s chacune</span></button>
      <button data-act="sudden"><b>Mort subite</b><span>Stop à la première erreur</span></button>
      <button data-goto="memo"><b>Fiches mémo</b><span>${MEMOS.length} mémos, l’essentiel en un écran</span></button>
      <button data-goto="methode"><b>La méthode</b><span>Pourquoi l’appli marche comme ça</span></button></section>`;
  const weakCh = CHAPITRES.map(([k,nm])=>Object.assign({k,nm},chapPct(k))).filter(c=>c.n && c.seen>=3 && c.pSeen<70).sort((a,b)=>a.pSeen-b.pSeen).slice(0,4);
  const weakF = FICHES.filter(x=>S.fm[x.id]===-1);
  html += `<section><div class="eyebrow">À retravailler en priorité</div><h2 class="sec-title" style="margin:2px 0 10px">Mes points faibles</h2>`;
  if(!weakCh.length && !weakF.length && !dz){
    html += `<div class="card empty">Rien de signalé. Les thèmes sous 70 % de réussite, tes pièges de confiance et les fiches marquées « à retravailler » apparaîtront ici.</div>`;
  } else {
    html += `<div class="weak">${dz?`<button data-act="danger"><span>Pièges de confiance : sûr de toi mais faux</span><span class="k" style="color:var(--bad)">${dz}</span></button>`:""}${weakCh.map(c=>`<button data-train="${c.k}"><span>Quiz · ${esc(c.nm)}</span><span class="k">${c.pSeen} % réussi</span></button>`).join("")}${weakF.map(x=>`<button data-fiche="${x.id}"><span>Fiche · ${esc(x.t)}</span><span class="k">${esc(CHAP[x.ch])}</span></button>`).join("")}</div>`;
  }
  html += `</section>`;

function poolFor(mode){
  const th = setup.themes;
  let base = QUIZ.filter(q=>!th.length || th.includes(q.th));
  if(mode==="jour") return dailyPool();
  if(mode==="errors") return shuffle(errorsList());
  if(mode==="danger") return shuffle(dangerList());
  if(mode==="sudden") return shuffle(QUIZ);
  if(mode==="banc"){ const l=QUIZ.filter(q=>q.ty==="lance"); const sc=q=>{const r=S.q[q.id]; return !r?0:(r.last===false?1:2+Math.min(r.ok,5));}; return shuffle(l).sort((a,b)=>sc(a)-sc(b)).slice(0,10); }
  if(mode==="exam") return shuffle(base).slice(0,30);
  const score = q => { const r=S.q[q.id]; if(!r) return 0; if(r.last===false) return 1; return 2 + Math.min(r.ok,5); };
  const sorted = shuffle(base).sort((a,b)=>score(a)-score(b));
  return shuffle(setup.n ? sorted.slice(0,setup.n) : sorted);
}
function startQuiz(mode, themes){
  if(themes) setup.themes = themes;
  setup.mode = mode;
  const list = poolFor(mode);
  if(!list.length){ toast("Aucune question pour ce choix"); return; }
  cur = {tab:"quiz", run:{mode, list:list.map(prep), i:0, answers:[], t0:Date.now()}};
  try{ history.replaceState(null,"","#quiz"); }catch(e){}
  render(); window.scrollTo(0,0);
}
function prep(q){
  const p = {q, picked:[], done:false};
  if(q.ty==="qcm"||q.ty==="multi"){ p.order = shuffle(q.o.map((_,i)=>i)); }
  else if(q.ty==="vf"){ p.order=[0,1]; }
  else if(q.ty==="ordre"){ p.order = shuffle(q.o.map((_,i)=>i)); if(p.order.every((v,i)=>v===i)) p.order.reverse(); p.seq=[]; }
  else if(q.ty==="lance"){ p.sel={d:null,j:null,g:null}; }
  else if(q.ty==="expl"){ p.shown=false; p.kk=[]; }
  return p;
}

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

const TYPES = {qcm:"Une seule réponse", multi:"Plusieurs réponses possibles", vf:"Vrai ou faux", ordre:"Remets dans l’ordre", lance:"Décision", expl:"Explique-le avec tes mots"};
const CERT = [["s","Sûr"],["h","Hésitant"],["g","Au hasard"]];
const useCert = R => S.cert && R.mode!=="exam";
function ready(P){
  const q=P.q;
  if(q.ty==="qcm"||q.ty==="vf") return P.picked.length===1;
  if(q.ty==="multi") return P.picked.length>0;
  if(q.ty==="ordre") return P.seq.length===q.o.length;
  if(q.ty==="lance") return P.sel.d!=null && P.sel.j!=null && P.sel.g!=null;
  return false;
}
function vValidate(R,P){
  if(P.done || P.q.ty==="expl") return "";

    return `<div class="certbox ${ok?"":"off"}"><div class="eyebrow">${ok?"Avant de voir la correction : tu es…":"Choisis ta réponse, puis ton degré de certitude"}</div><div class="cert">${CERT.map(([k,l])=>`<button class="btn ${k==="s"?"primary":""}" data-cert="${k}" ${ok?"":"disabled"}>${l}</button>`).join("")}</div></div>`;
  }
  return `<button class="btn primary" data-act="validate" ${ok?"":"disabled"}>Valider</button>`;
}
