<script>
/* Révisions SUAP — sources : GDO DGSCGC « Secours et soins d’urgence aux personnes » (nov. 2022, V1.1)
   et Références techniques nationales PSE (version juillet 2026). Pages citées = pages du PDF. */
const CHAPITRES = [
  ["cadre","Cadre SSUAP & doctrine"],
  ["secu","Sécurité de l’équipage"],
  ["bilan","Bilan : les 4 regards"],
  ["param","Paramètres & scores"],
  ["vital","Urgences vitales"],
  ["detr","Détresses & oxygène"],
  ["malaise","Malaises & affections"],
  ["trauma","Traumatismes"],
  ["circ","Atteintes circonstancielles"],
  ["situ","Situations particulières & NOVI"]
];

const FICHES = [
/* ============ CADRE ============ */
{id:"missions",ch:"cadre",t:"Missions SSUAP, prompt secours et actes",src:"GDO SSUAP ch.1 p.16-19",
cle:"Le SIS porte secours aux personnes victimes d’accidents, sinistres ou catastrophes, ou qui présentent une détresse vitale, ou une détresse fonctionnelle justifiant l’urgence à agir (art. L1424-2 CGCT). Le prompt secours est une action réflexe, en équipe, sur ces détresses.",
b:[
 ["Les 3 situations qui fondent l’action du SIS",["Victimes d’<b>accidents, de sinistres ou de catastrophes</b>.","Signes de <b>détresse vitale</b>.","Signes de <b>détresse fonctionnelle</b> justifiant l’urgence à agir.","Hors de ce champ, le SIS peut demander une participation aux frais (art. L1424-42) et peut refuser ou différer pour préserver son potentiel."]],
 ["Prompt secours",["Action de sapeurs-pompiers <b>agissant en équipe</b>, visant à prendre en charge <b>sans délai</b> les détresses vitales et fonctionnelles.","Sa force : son caractère <b>réflexe</b>, par des personnels formés et équipés.","À distinguer des situations qui demandent un diagnostic approfondi avant de répondre (médecin, ambulancier privé, simple conseil)."]],
 ["Actes accessibles à tout SP formé (décret 2022-621)",["Température, pouls, PA <b>non invasive</b>.","<b>Glycémie</b> capillaire ou lecture transdermique.","Aérosols de produits <b>non médicamenteux</b>.","<b>Scores</b> de gravité clinique.","SpO₂ et <b>SpCO</b> non invasives."]],
 ["Actes thérapeutiques (SP habilité, sur prescription du régulateur ou d’un médecin sur place)",["Aérosol/pulvérisation : <b>asthme aigu grave</b> chez l’asthmatique connu, douleurs aiguës.","Voie orale ou intranasale : <b>overdose d’opiacés</b>, douleurs aiguës.","<b>Stylo auto-injecteur</b> : choc anaphylactique, hypoglycémie.","Enregistrement et transmission d’<b>ECG</b> ; recueil de l’hémoglobinémie.","La prescription est <b>tracée</b> (prescripteur, actes, produits, posologie)."]]
],
o:["« Je ne fais pas un acte thérapeutique parce que je sais le faire : je le fais parce que le médecin régulateur l’a prescrit, et je le trace. »"],
p:["Recueillir une glycémie est un acte de bilan (tout SP formé). Administrer du glucagon par auto-injecteur est un acte thérapeutique sur prescription.","Le prompt secours n’est pas « le petit secours » : c’est la réponse réflexe aux détresses."]},

{id:"victime",ch:"cadre",t:"La victime : catégories, droits, secret",src:"GDO SSUAP §5 p.21-24",
cle:"Victime = impliquée, blessée, malade ou décédée. Le décès est constaté par un médecin, ou par un secouriste si tête détachée du tronc, rigidité cadavérique ou putréfaction. Le secret professionnel ne se partage ni avec la presse, ni avec le conjoint, et seulement au strict nécessaire avec les forces de l’ordre.",
b:[
 ["Catégories",["<b>Impliqué</b> : non blessé physiquement, exposé à un risque de mort ou de blessure, peut relever d’une prise en charge médico-psychologique.","<b>Malade</b> : état lié à une affection. <b>Blessé</b> : atteinte corporelle traumatique.","<b>Décédé</b> : constaté par un médecin, ou par le secouriste si <b>tête séparée du tronc</b>, <b>rigidité cadavérique</b> ou <b>putréfaction</b>.","Secouriste : <b>EL</b> (état léger) / <b>EG</b> (état grave). Tri médical : impliqué, <b>UR</b> (pronostic vital non engagé), <b>UA</b> (pronostic vital engagé)."]],
 ["Urgence vitale / fonctionnelle",["<b>Vitale</b> : vie en danger imminent, risque de décès faute de soins rapides.","<b>Fonctionnelle</b> : vie non menacée immédiatement, mais soins rapides nécessaires pour éviter un <b>handicap</b>."]],
 ["Libre choix de destination",["Principe fondamental… limité par les capacités des établissements.","La destination = structure la plus proche <b>la mieux adaptée</b>, déterminée par le <b>médecin régulateur</b>, qui tient compte du choix de la victime.","Transfert secondaire vers l’établissement de son choix : pas, normalement, du ressort du SIS."]],
 ["Secret professionnel (art. 226-13 CP)",["Couvre tout ce qui a été <b>vu, entendu ou supposé</b>.","Ne s’éteint pas avec le décès. Le <b>conjoint</b> ne fait pas partie des personnes avec qui il se partage.","Rien à la presse, ni aux élus, pas même le simple fait d’une hospitalisation.","Forces de l’ordre : uniquement ce qui est nécessaire à la prise en charge et/ou à la sécurité des intervenants. Le secret médical ne se partage pas avec elles.","Levée obligatoire (226-14) : sévices sur mineur de moins de 15 ans ou personne hors d’état de se protéger, crimes/délits connus dans les fonctions, réquisitions judiciaires, témoignage en justice."]]
],
o:["« Monsieur l’agent, je peux vous dire qu’il est conscient et qu’on l’emmène au CH. Pour le reste, je ne peux pas vous en dire plus. »"],
p:["Un secouriste ne constate pas un décès sur un simple ACR prolongé : seulement tête séparée, rigidité ou putréfaction.","« Il a refusé, c’est noté » ne suffit pas : bilan au régulateur obligatoire avant de quitter les lieux."]},

{id:"refus",ch:"cadre",t:"Refus, laisser sur place, évacuation et hôpital",src:"GDO SSUAP ch.5 §2 p.48-51",
cle:"Le majeur en pleine possession de ses capacités peut refuser : information simple, intelligible, explicite et loyale, puis bilan obligatoire au médecin régulateur avant de quitter les lieux. La victime reste sous ta responsabilité jusqu’à sa prise en charge par le soignant de l’accueil.",
b:[
 ["Prise en charge par les primo-intervenants",["Bilan patient-victime (fiche bilan) transmis au SAMU + message de renseignement au CODIS.","Procédures adaptées, assistance à l’équipe médicale/paramédicale, conditionnement, surveillance permanente.","Transmission du bilan dans les meilleurs délais <b>avant l’évacuation</b>."]],
 ["Laisser sur place",["Décidé par le médecin régulateur au vu du bilan.","L’appelant est mis en relation directe avec le régulateur chaque fois que possible, qui explique la décision."]],
 ["Refus de prise en charge",["Droit du majeur capable : aucun acte de diagnostic, de soins ou d’évacuation sans son consentement. Personne ne peut le forcer à suivre.","Information <b>simple, intelligible, explicite, loyale</b> (consentement libre et éclairé).","Bilan obligatoire au régulateur précisant le refus, <b>avant de quitter les lieux</b> ; le régulateur s’entretient si possible avec la personne (ligne enregistrée).","Un <b>mineur</b> ne peut pas refuser : seul son responsable légal le peut. Un <b>majeur protégé</b> ne peut refuser son évacuation si le médecin l’estime nécessaire."]],
 ["Évacuation et arrivée",["Aggravation pendant le transport : <b>nouveau bilan</b> et recontact du régulateur, quelle que soit la distance restante. Options : poursuivre en prévenant, suspendre dans l’attente d’un moyen médicalisé, point de jonction.","À l’accueil : dernier bilan <b>horodaté</b> avant transfert de responsabilité ; fiche bilan remise à l’<b>IAO</b> avec les effets personnels.","Victime sous la responsabilité des secours tant que le personnel soignant ne l’a pas prise en charge.","Reconditionnement : hygiène et désinfection, réarmement, hygiène des personnels ; débriefing technique/psychologique si besoin."]]
],
o:["« Madame, sans examen à l’hôpital, ce malaise peut se reproduire sur la route ; vous restez libre, mais je dois passer le relais au médecin du 15 qui va vous parler. »"],
p:["Un avis médical « rouler vite » n’exonère jamais le conducteur en cas d’accident.","La présence d’un parent n’est pas obligatoire pour évacuer un mineur et ne doit pas retarder l’évacuation."]},

/* ============ SÉCURITÉ ============ */
{id:"risques",ch:"secu",t:"Les risques de l’équipage VSAV",src:"GDO SSUAP ch.2-3 p.27-36",
cle:"Infectieux, blessures, psychologique, agression, TMS, routier, juridique. Les agressions surviennent à 80 % en SSUAP ; les TMS sont la 1re cause d’accidents liés au SSUAP ; la route reste la 1re cause de mortalité au travail.",
b:[
 ["Agression",["80 % des agressions de SP surviennent en <b>SSUAP</b>, le plus souvent par la victime ou ses proches.","Répartition : verbales <b>50 %</b>, simples <b>35 %</b>, projectiles <b>11 %</b>, avec arme <b>4 %</b>.","Le CA : surveiller l’extérieur, demander les forces de l’ordre, ne pas exposer l’équipage, isoler la victime (mains, objets dangereux), attitude <b>ferme mais non agressive</b>.","Risque grave : action différée possible, <b>repli raisonné</b>.","Renforts : on peut demander de couper deux-tons et gyrophares à l’approche pour ne pas provoquer une victime agitée."]],
 ["Route",["Tous les occupants du VSAV <b>ceinturés</b> à chaque déplacement (sauf justification médicale ou contexte), matériel arrimé.","La dérogation de vitesse ne dispense pas d’être maître du véhicule (R.432-1). Le CA contrôle la vitesse appliquée.","Pluie, brouillard : vitesse adaptée <b>dans la limite de la vitesse maximale autorisée</b>, quelle que soit l’urgence.","Nombre de personnes à bord : celui du certificat d’immatriculation, <b>hors victime allongée</b>.","Sur la voie publique : balisage initial ; haute visibilité <b>obligatoire</b> sur domaine routier/autoroutier."]],
 ["TMS et blessures",["TMS : <b>1re cause</b> d’accidents en activité SSUAP (charges lourdes, postures inconfortables ou maintenues).","Le CA peut demander appui brancardage, moyen élévateur, SMPM… selon corpulence et configuration.","Blessures : précipitation sans repérer les obstacles, brancardage."]],
 ["Juridique et psychologique",["Prévention juridique : qualité de la communication, des actions, <b>traçabilité</b>.","Psychologique : suicide, décès d’enfant, lien avec la victime, intégrité corporelle ou psychique atteinte, sentiment d’impuissance."]]
],
o:["« On se gare en protection, gilets haute visibilité, et je passe devant pour la reconnaissance. »"],
p:["En pluie battante, même pour un ACR, on ne dépasse pas la vitesse maximale autorisée.","La qualité de SP d’une victime ne justifie aucune entorse aux procédures de prise en charge."]},

{id:"infect",ch:"secu",t:"Risque infectieux et AES",src:"GDO SSUAP §2.1 p.35-36 · RTN risques infectieux",
cle:"Gants à usage unique systématiques, masque pour toi et la victime dès qu’elle tousse ou éternue, lunettes en cas de projection (aspiration). AES sans protocole local : laver eau + savon puis désinfecter au moins 5 minutes ; muqueuses : rinçage abondant au sérum physiologique.",
b:[
 ["Voies de contamination",["Sang/liquide biologique par <b>piqûre, coupure</b>, peau lésée, muqueuses : surtout viral (VHB, VHC, VIH).","Sécrétions ORL/bronchiques (toux, éternuements) : bactérien et viral par inhalation.","<b>Mains</b> : transfert de contamination. Le SP peut lui-même être une source pour la victime."]],
 ["Précautions",["<b>Gants</b> à usage unique systématiques.","<b>Masque</b> pour le SP, et pour la victime si possible, dès signes infectieux, toux ou éternuements.","Sur-tenue si nécessaire ; <b>protection oculaire</b> pour les gestes à risque de projection (aspiration).","Limiter le temps d’exposition et le nombre de SP exposés ; mains loin du visage.","Lavage/friction des mains après tout contact, notamment <b>après retrait des EPI</b> ; matériel à usage unique ; <b>DASRI</b>."]],
 ["Accident d’exposition au sang (sans protocole local)",["Piqûre/coupure : laver <b>immédiatement</b> à l’eau potable et au savon.","Puis désinfecter <b>5 minutes minimum</b> (Dakin, eau de Javel diluée, à défaut produit iodé).","Projection sur muqueuses : rincer abondamment au <b>sérum physiologique</b>, à défaut à l’eau.","Suivre ensuite la procédure du SIS."]]
],
o:["« Gants pour tout le monde, et masque chirurgical à monsieur, il tousse depuis trois jours. »"],
p:["Faire saigner la plaie n’est pas dans la conduite à tenir : lavage, savon, désinfection 5 min.","Le gant ne remplace pas l’hygiène des mains : friction après retrait."]},

/* ============ BILAN ============ */
{id:"regards",ch:"bilan",t:"Le bilan en 4 regards",src:"RTN 04AC01 · 04PR01-04 p.65-70",
cle:"3 principes : global puis détail, traiter en priorité ce qui tue en premier, cercles de contrôle continus (évaluer, agir, contrôler, réévaluer). 1er regard = situation et dangers ; 2e = menace vitale et plainte principale ; 3e = les 3 fonctions vitales une à une ; 4e = interrogatoire, examen, paramètres.",
b:[
 ["1er regard : la situation",["Que s’est-il passé ? Les infos de départ sont-elles justes ? Danger immédiat ou à venir ? Combien de victimes ? Moyens suffisants ?","Dangers évidents (véhicules, structure instable, violence) et <b>moins évidents</b> (électrique, toxique, impact psychologique).","Demander les moyens complémentaires <b>le plus tôt possible</b> ; nombreuses victimes : transmettre sans délai, nombre approximatif et gravité apparente.","Précautions standards ou particulières (risque infectieux)."]],
 ["2e regard : la menace vitale",["En avançant : genre, âge, position ; conscience (« Comment ça va ? Ouvrez les yeux, serrez-moi la main »).","<b>Hémorragie externe grave</b> → l’arrêter. <b>Obstruction</b> ou VA menacées → libérer (retirer le casque). <b>Absence de réaction sans respiration ou respiration anormale</b> → RCP.","Victime qui a perdu connaissance : <b>sur le dos</b> avant de rechercher la ventilation.","Toute détresse vitale → <b>avis médical ou demande de renfort</b> en parallèle.","Plainte principale ; position adaptée ; stabilisation du rachis cervical à titre conservatoire si traumatisme suspecté.","La <b>surveillance</b> commence dès le 2e regard."]],
 ["3e regard : les fonctions vitales",["Respiratoire, circulatoire, neurologique, l’une après l’autre, en <b>appréciant</b> (dires de la victime + constatations).","Dès qu’une détresse est identifiée : gestes immédiats, <b>même si l’examen de la fonction n’est pas fini</b>, et avis médical.","Puis mesure des paramètres s’ils ne ralentissent pas la progression."]],
 ["4e regard : compléter",["<b>Mécanisme</b> (trauma : nature, intensité, éléments particuliers) ou événement déclencheur, ou histoire de la maladie.","Plaintes analysées par <b>PQRST</b> : Provoqué par, Qualité, Région, Sévérité, Temps.","Antécédents <b>MHTAF</b> : Médicaux/chirurgicaux, Hospitalisations, Traitements, Allergies, Facteurs de risque.","Examen : plaies, brûlures, contusions, hématomes, gonflements, écoulements, déformations.","Paramètres <b>systématiques</b> : FR, SpO₂, FC, PA. Selon contexte : glycémie, température, ECG (habilité). <b>La clinique prime sur les appareils.</b>","Scores : douleur, EVDA/Glasgow, Wallace/Lund-Browder, AVC.","Transmettre au régulateur <b>sans interpréter</b>."]]
],
o:["« Je passe au 4e regard : tu prends FR, SpO₂, FC et PA pendant que je fais l’interrogatoire. »"],
p:["L’appareil ne prime jamais sur la clinique : une SpO₂ « belle » chez un intoxiqué au CO est fausse.","Le 3e regard ne s’interrompt pas pour « finir » : la détresse identifiée se traite tout de suite.","On transmet des faits (« FC 128, peau pâle et froide »), pas un diagnostic (« il fait un choc »)."]},

{id:"transmission",ch:"bilan",t:"Surveillance et transmission du bilan",src:"RTN 04PR05-06 p.71-72 · GDO p.48",
cle:"Paramètres renouvelés toutes les 5 minutes en cas de détresse vitale, sinon toutes les 10 à 15 minutes. Détresse vitale : demande de renfort médical sans délai (nature, motif, sexe et âge), bilan complet ensuite. Sans détresse : motif réel, sexe et âge, plainte principale, résultats et gestes.",
b:[
 ["Surveillance",["Débute dès le <b>2e regard</b>, constante, jusqu’à la transmission à l’équipe qui assure la continuité des soins.","Paramètres : toutes les <b>5 min</b> si détresse vitale, sinon toutes les <b>10 à 15 min</b>.","Tout changement d’état → gestes adaptés <b>immédiatement</b> et transmission (régulateur, renfort, équipe de relais)."]],
 ["Pourquoi transmettre",["Demander un avis médical, demander du renfort, définir l’orientation, réaliser un relais.","Concise, complète, structurée, logique, <b>chronologique</b>."]],
 ["Selon la situation",["<b>Renforts immédiats</b> : nature de l’intervention, moyens sur place, moyens demandés, corrections des infos de départ.","<b>Détresse vitale</b> : demande de moyen médical <b>sans délai</b> : nature de l’intervention, <b>motif</b> du renfort, <b>sexe et âge</b>. Le bilan complet suit.","<b>Pas de détresse</b> : après interrogatoire, examen et mesures : motif réel, sexe et âge, plainte principale, résultat du bilan et gestes entrepris."]]
],
o:["« CODIS de VSAV 1 : demande de SMUR pour homme de 60 ans, arrêt cardiaque devant témoin, RCP et DAE en cours, un choc délivré. Bilan complet suit. »"],
p:["Sur détresse vitale, ne pas attendre d’avoir « tout le bilan » pour demander le SMUR.","Pendant le transport, l’aggravation impose un nouveau bilan, même à 2 minutes du CH."]},

/* ============ PARAMÈTRES ============ */
{id:"normes",ch:"param",t:"Valeurs normales FR, FC, SpO₂, PA, TRC",src:"RTN 04FT07-10 p.82-91",
cle:"FR : adulte 12-20, enfant 20-30, nourrisson 30-40, nouveau-né 40-60. FC : adulte 60-100, enfant 70-140, nourrisson 100-160, nouveau-né 120-160. SpO₂ 94-100 %. TRC < 2 s. PA adulte au repos autour de 100/80 mmHg, pas de valeur de référence chez l’enfant.",
b:[
 ["Respiration",["Rechercher : LVA, oreille et joue au-dessus de la bouche, <b>10 secondes au plus</b> (flux, bruit, soulèvement).","Apprécier ≈ <b>15 s</b> : rapidité, amplitude, régularité, coloration. Normalement un mouvement toutes les ≈ <b>5 s</b> chez l’adulte (3-4 s chez l’enfant), pas de pause de plus de <b>6 s</b>.","Mesurer sur <b>1 minute</b>. FR : adulte <b>12-20</b> · enfant <b>20-30</b> · nourrisson <b>30-40</b> · nouveau-né <b>40-60</b>."]],
 ["SpO₂",["Normale <b>94 à 100 %</b>.","Faussée : agitation, tremblements, extrémités froides, détresse circulatoire, vernis, doigt sale, pigmentation.","<b>Fumées / CO</b> : valeurs <b>faussement rassurantes</b>.","Ne retarde jamais un geste d’urgence évident ; pas utile en ACR."]],
 ["Circulation",["Pouls carotidien (adulte, enfant), <b>fémoral</b> (nourrisson), 10 s au plus, en même temps que la ventilation.","Apprécier 15 s : radial, sinon carotidien, sinon fémoral. Peau chaude, sèche, rose.","FC : adulte <b>60-100</b> · enfant <b>70-140</b> · nourrisson <b>100-160</b> · nouveau-né <b>120-160</b>.","TRC <b>< 2 s</b>. PA adulte au repos ≈ <b>100 systolique / 80 diastolique</b>.","Enfant : <b>pas de valeur de référence</b> de PA ; transmettre la valeur pour avis."]],
 ["Mesure de la PA",["L’automatique est préférable pour le secouriste ; brassard idéalement à même la peau, repère sur l’artère (face interne du bras).","Auscultation : brassard 2 cm au moins au-dessus du pli du coude, gonfler 30 mmHg au-delà de la disparition du bruit, dégonfler 2-3 mmHg/s.","Palpation (ambiance bruyante) : <b>systolique seulement</b>.","Pas de brassard sur le bras perfusé, lésé, douloureux ou contre-indiqué."]]
],
o:["« FR 28, SpO₂ 91 % en air ambiant, FC 118 régulière, TRC 3 s, PA 95/60. »"],
p:["Le pouls affiché par l’oxymètre donne une tendance : la mesure manuelle reste importante.","Chez l’enfant, une PA « normale » n’existe pas en chiffre unique : on transmet."]},

{id:"neuro",ch:"param",t:"Fonction neurologique, glycémie, température, douleur",src:"RTN 04FT12-14 p.95-102",
cle:"EVDA : Éveillé, réactif à la Voix, à la Douleur (pression à la base de l’ongle, seule stimulation autorisée), Aréactif. Glasgow normal > 12. FAST positif = avis médical immédiat. Sucre si glycémie < 0,6 g/L (< 3,3 mmol/L, < 60 mg/dL).",
b:[
 ["Rechercher et apprécier",["Perte de connaissance : question simple + ordre simple, secouer doucement les épaules.","Orientation (nom, date, lieu), PC initiale ou passagère (entourage, amnésie), motricité et sensibilité des 4 membres, pupilles (taille, symétrie, réactivité)."]],
 ["Scores",["<b>EVDA</b> (AVPU) : E éveillé · V voix · D douleur · A aréactif. Stimulation douloureuse : <b>pression à la base d’un ongle uniquement</b>.","<b>Glasgow</b> : normal <b>> 12</b>.","<b>FAST</b> : Face (sourire), Arm (bras tendus yeux fermés <b>10 s</b>), Speech (répéter une phrase), Time. Une seule anomalie = positif → avis médical immédiat.","Autres scores (CPSS, LAPSS) ; LAPSS exige une glycémie > 0,6 g/L pour être positif."]],
 ["Glycémie capillaire",["Indications : signes d’<b>AVC</b>, malaise possiblement hypoglycémique (diabétique, effort, à jeun), <b>troubles du comportement</b>, <b>perte de connaissance</b>, demande du régulateur.","Nettoyer à l’eau (ou eau + savon), <b>sécher</b>, piquer la face <b>latérale</b> de la 3e phalange du majeur, de l’annulaire ou de l’auriculaire (<b>pas pouce ni index</b>).","Seuil de resucrage : <b>< 0,6 g/L</b> = < 3,3 mmol/L = < 60 mg/dL. Transmettre <b>avec l’unité</b>.","Autopiqueur → collecteur OPCT ; bandelette → DASRI."]],
 ["Température",["Systématique si suspicion d’hypo- ou d’hyperthermie.","Tympanique, électronique (+½ à 1 °C selon le site), médical (≈ 3 min), frontal."]]
],
o:["« Score EVDA : D, il ne réagit qu’à la pression sur l’ongle ; pupilles égales et réactives ; glycémie 0,45 g/L. »"],
p:["Pincer le trapèze ou frotter le sternum : non. La seule stimulation douloureuse est la pression à la base de l’ongle.","Une victime qui a perdu connaissance et n’est plus réactive à la voix est en détresse neurologique."]},

/* ============ URGENCES VITALES ============ */
{id:"hemo",ch:"vital",t:"Hémorragies externes, garrot, gaze hémostatique",src:"RTN 05AC02 · 05PR01 · 05FT04-05 p.116-125",
cle:"Comprimer immédiatement (la victime ou toi), allonger, pansement compressif pour te libérer. Compression inefficace ou impossible : garrot si zone garrotable, gaze hémostatique sinon. Garrot à 5-7 cm de la plaie, entre plaie et racine, jamais sur une articulation, heure notée, desserré seulement sur ordre médical.",
b:[
 ["Reconnaître",["Perte de sang qui ne s’arrête pas spontanément, imbibe un mouchoir en <b>quelques secondes</b>.","Peut être masquée par la position ou un vêtement absorbant : découverte parfois au 4e regard.","Mécanisme : la FC augmente pour compenser, puis la PA s’effondre (désamorçage de la pompe, arrêt cardiaque)."]],
 ["Conduite à tenir",["Gants (à défaut main dans un sac plastique, sans retarder).","Demander à la victime de comprimer, ou le faire à sa place ; <b>allonger</b> (retarde la détresse).","<b>Pansement compressif</b> si contrôlée manuellement, pour se libérer.","Inefficace ou impossible (nombreuses victimes, plaie inaccessible, corps étranger, os visible…) : <b>garrot</b> (garrotable) ou <b>gaze hémostatique</b> (non garrotable).","Rassurer, <b>réchauffer</b> (l’hypothermie aggrave), surveiller efficacité et signes de détresse circulatoire.","Corps étranger ou os visible : n’y touche pas ; si saignement massif → garrot."]],
 ["Garrot",["Uniquement membres supérieurs ou inférieurs.","<b>Quelques cm</b> de la plaie (idéalement <b>5 à 7 cm</b>), entre la plaie et la racine du membre, <b>jamais sur une articulation</b>.","Improvisé : lien non élastique <b>3 à 5 cm</b> de large, ≥ <b>1,50 m</b> ; barre de 10 à 20 cm ; 2 tours, nœud, barre, 2 nœuds, tourner jusqu’à l’arrêt.","Jamais de garrot élastique de prise de sang.","Noter l’<b>heure de pose</b> ; desserrage <b>sur ordre médical uniquement</b>.","Saignement persistant : resserrer, puis 2e garrot entre le premier et la racine et/ou gaze hémostatique."]],
 ["Gaze hémostatique",["Racine de membre (creux axillaire, pli de l’aine), fesses, cou, tête.","Pénétrer la plaie jusqu’à la source, pression <b>3 minutes minimum</b> et jusqu’à l’arrêt, puis pansement compressif.","<b>Ne jamais la retirer</b>. Jamais au contact d’organes/viscères ni en présence de corps étranger.","Noter nombre, heure et localisation."]]
],
o:["« Garrot posé à 14 h 32 sur la cuisse droite, hémorragie arrêtée, je l’inscris sur le garrot. »"],
p:["Plaie du cou ou au pli de l’aine : pas de garrot → compression ou pansement compressif avec contre-appui, ou gaze hémostatique.","On ne desserre pas un garrot « pour voir si ça saigne encore »."]},

{id:"obstru",ch:"vital",t:"Obstruction des voies aériennes",src:"RTN 05AC04 · 05PR03 · 05FT07-09 p.128-134",
cle:"Peut parler, crier, tousser : encourager la toux et surveiller. Ne peut plus : de 1 à 5 claques dans le dos, puis de 1 à 5 compressions (abdominales adulte/enfant ; thoraciques nourrisson, obèse, femme enceinte, personne alitée), en alternant. Perte de connaissance : au sol et RCP.",
b:[
 ["Conduite à tenir",["Demander « Vous vous étouffez ? » et de tousser.","<b>Partielle</b> (parle, crie, tousse) : encourager la toux (pression élevée et soutenue), surveiller fatigue et efficacité.","<b>Complète</b> : laisser dans sa position (debout, assise), <b>1 à 5 claques</b> dans le dos, puis <b>1 à 5 compressions</b> si inefficace ou impossible ; répéter le cycle.","Arrêter dès toux efficace, cris/pleurs, reprise de la respiration ou rejet du corps étranger."]],
 ["Quelles compressions ?",["<b>Abdominales</b> : adulte, enfant.","<b>Thoraciques</b> : <b>nourrisson</b>, personne <b>obèse</b> ou <b>femme enceinte</b> (abdomen impossible à encercler), personne <b>alitée ou allongée</b> difficilement mobilisable.","Thoraciques debout : poing au milieu du sternum, sans appuyer sur la pointe inférieure."]],
 ["Après",["Position d’attente confortable, desserrer les vêtements, surveiller la respiration.","<b>Avis médical systématique</b> : de petits fragments peuvent passer dans les poumons, et les compressions peuvent provoquer des lésions internes.","Perte de connaissance : accompagner au sol, <b>RCP</b>."]]
],
o:["« Elle ne peut plus parler : cinq claques… rien. Je passe aux compressions, elle est enceinte, donc thoraciques. »"],
p:["La toux efficace, on ne la coupe pas avec des claques.","La version 2026 parle de « 1 à 5 » claques et compressions : on s’arrête dès que c’est efficace.","Personne alitée difficilement mobilisable : compressions thoraciques."]},

{id:"acr",ch:"vital",t:"Arrêt cardiaque en équipe",src:"RTN 05AC05 · 05PR04-05 p.135-140",
cle:"Ne répond pas + ne respire pas ou respiration agonique (≤ 6 mvts/min, moins d’1 en 10 s) = ACR. Adulte 30/2, enfant et nourrisson 15/2. DAE et O₂ au plus tôt en interrompant le moins possible ; reprise immédiate des compressions après le choc ou l’absence de choc, sans attendre les consignes vocales.",
b:[
 ["Reconnaître",["Ne répond pas, ne réagit pas.","Absence de mouvements ventilatoires, ou <b>ventilation agonique</b> : inefficace, bruyante, anarchique, lente (<b>moins d’1 mouvement en 10 s</b>, ≤ 6 mvts/min).","Parfois brèves secousses ressemblant à des convulsions.","Pouls non systématique ; si recherché, simultané à la ventilation, <b>≤ 10 s</b>. Absence ou <b>doute</b> → RCP."]],
 ["En équipe avec matériel",["Retirer un corps étranger visible et facilement accessible.","Cycles <b>30/2</b> chez l’adulte, <b>15/2</b> chez l’enfant et le nourrisson.","Au plus tôt, en interrompant le moins possible : <b>DAE</b> et <b>O₂ par insufflation</b>.","Après la délivrance (ou non) d’un choc : <b>reprendre la RCP immédiatement</b>, sans attendre les instructions vocales.","Thorax qui ne se soulève pas après 2 insufflations : penser obstruction, vérifier la bouche après chaque cycle.","Aspiration et canule si nécessaire, <b>sans retarder ni interrompre</b> RCP ou choc."]],
 ["Organisation",["<b>2 sans DAE</b> : l’un masse, l’autre va chercher un DAE et demande le renfort médical.","<b>2 avec DAE</b> : l’un masse, l’autre met en œuvre le DAE puis demande le renfort <b>juste après la 1re analyse</b>.","<b>3 ou plus</b> : alerte, RCP et DAE <b>simultanés</b>.","Relais toutes les <b>2 min</b> environ (pendant l’analyse). Un « <b>coach</b> » peut guider, encourager, corriger.","Témoin qui a fait la RCP : évaluer son état émotionnel, valoriser son action."]],
 ["Reprise et contrôle du pouls",["Signes de vie : cesser RCP, garder <b>strictement allongée</b>, bilan depuis le 2e regard, prêt à reprendre (récidive fréquente).","À partir de <b>3</b> secouristes, contrôle du pouls possible : pouls présent mais ventilation absente ou ≤ 6/min → insufflations seules : <b>10/min</b> adulte-enfant, <b>20/min</b> nourrisson, <b>30/min</b> nouveau-né.","Chaque minute gagnée pour le DAE : <b>+ 10 %</b> de chances de survie ; la chaîne de survie porte la survie de 4 à 40 %."]]
],
o:["« Pas de respiration, je masse ! Toi le DAE, puis tu demandes le SMUR après la première analyse. »"],
p:["Le gasp n’est pas une respiration : on masse.","Pas de pause « pour écouter le DAE » après le choc : on reprend tout de suite.","Isolé sans réseau : on quitte la victime pour alerter, puis on revient."]},

{id:"rcp",ch:"vital",t:"Compressions, ventilation, DAE",src:"RTN 05FT10-16 p.141-157",
cle:"100 à 120/min, un tiers de l’épaisseur du thorax : ≈ 5 cm adulte, ≈ 4 cm enfant/nourrisson, relâchement complet. Électrodes adulte et enfant > 25 kg : sous la clavicule droite contre le sternum, et sur le côté gauche ; < 25 kg : avant/arrière.",
b:[
 ["Compressions",["Victime sur un plan dur, à genoux au plus près.","Adulte : talon de la main au centre de la poitrine, <b>moitié inférieure du sternum</b>, bras tendus.","Fréquence <b>100 à 120/min</b>, profondeur <b>⅓ du thorax</b> : ≈ <b>5 cm</b> adulte, ≈ <b>4 cm</b> enfant et nourrisson.","Relâchement complet sans décoller la main ; temps de compression = temps de relâchement.","Débit obtenu : <b>20 à 30 %</b> du débit cardiaque normal. Relais toutes les 2 min.","Nourrisson : <b>2 pouces</b> (ou 2 doigts) sur la moitié inférieure du sternum."]],
 ["Ventilation",["BAVU : adulte (> 25 kg) 1 400-2 000 mL ; pédiatrique (2,5-25 kg) 400-500 mL ; prématuré 200-250 mL. Valve de surpression pédiatrique 35-40 mmHg.","Insufflation <b>douce et progressive</b> jusqu’au début du soulèvement du thorax.","Impossible (répulsion, vomissements, trauma facial…) : compressions seules en continu à 100-120/min.","Canule oropharyngée si ventilation inefficace par difficulté de maintien des VA.","Aspiration : <b>10 s</b> max chez l’adulte, <b>5 s</b> sinon."]],
 ["DAE",["Continuer la RCP pendant la pose des électrodes ; <b>sécher</b> la poitrine humide, raser si très velue, déplacer le soutien-gorge.","Adulte et enfant <b>> 25 kg</b> : une électrode sous la <b>clavicule droite</b> contre le bord droit du sternum, l’autre sur le <b>côté gauche</b> du thorax (5-10 cm sous l’aisselle).","Nourrisson et enfant <b>< 25 kg</b> : une devant au milieu du thorax, l’autre <b>dans le dos</b> entre les omoplates.","Pas d’électrodes pédiatriques : électrodes adultes en antéro-postérieur.","Analyse et choc : personne ne touche la victime.","<b>2 paires</b> d’électrodes avec le DAE."]]
],
o:["« Tu comprimes plus fort, on vise 5 cm, et laisse remonter… voilà, 110 par minute. »"],
p:["Compressions trop rapides (> 120) = moins de remplissage du cœur.","En l’absence d’électrodes enfant, on utilise les adultes, pas de renoncement au DAE."]},

{id:"pdc",ch:"vital",t:"Perte de connaissance et PLS",src:"RTN 05AC06 · 05PR06 · 05FT17-18 p.158-164",
cle:"Victime qui a perdu connaissance et respire : LVA, puis PLS (non traumatique) ou, à deux secouristes, PLS avec maintien de la tête si traumatisme et après avis médical. Haut risque de détresse respiratoire : surveillance permanente de la respiration.",
b:[
 ["Principe",["Risque : chute de la langue, inhalation de liquides (vomissements, sang) → détresse respiratoire puis arrêt.","Toute victime ayant perdu connaissance et qui respire est à <b>haut risque de détresse respiratoire</b>."]],
 ["Conduite à tenir",["Sur le dos, retirer le casque si besoin, <b>LVA</b> (bascule tête, élévation menton ; subluxation si trauma).","Respiration présente → <b>PLS</b>, protéger, alerter/avis médical, surveiller la respiration en permanence.","Suspicion de traumatisme : PLS <b>à 2 secouristes</b>, commandée par le secouriste de tête, après mise en place d’un collier si indiqué, <b>après avis médical</b>.","Femme enceinte : PLS sur le côté gauche.","Respiration qui s’arrête ou devient anormale → RCP."]]
],
o:["« Tu tiens la tête, je bascule à ton commandement. » — « Attention pour tourner… Tournez. »"],
p:["En PLS à 2, c’est le secouriste de tête qui commande, pas celui qui tourne.","La PLS ne dispense pas de surveiller : on garde la main sur le ventre."]},

/* ============ DÉTRESSES & O2 ============ */
{id:"detresses",ch:"detr",t:"Les 3 détresses : signes et seuils",src:"RTN 05AC07-09 · 05PR08-10 p.165-173",
cle:"Respiratoire : FR > 30, SpO₂ < 94 % (< 89 % chez l’insuffisant respiratoire), tirage, sueurs, cyanose → assise/demi-assise + O₂. Circulatoire : TRC > 2 s, FC > 120 ou < 40, PAS < 90 mmHg ou chute > 30 % chez l’hypertendu → allongée à plat + O₂ + réchauffer. Neurologique → allonger, O₂ si besoin.",
b:[
 ["Respiratoire",["Difficultés à parler, ventilation rapide/superficielle, <b>tirage</b>, battement des ailes du nez (enfant), <b>sueurs</b> sans effort ni fièvre (CO₂), <b>cyanose</b>.","FR souvent <b>> 30</b> ; SpO₂ <b>< 94 %</b> ou <b>< 89 %</b> chez l’insuffisant respiratoire chronique.","CAT : position <b>assise ou demi-assise</b> (libère le diaphragme), desserrer, O₂ adapté à la SpO₂ (sans valeur : continuer jusqu’à l’avis), protéger."]],
 ["Circulatoire",["Causes : pompe (infarctus), contenu (hémorragie, déshydratation, brûlure étendue), contenant (allergie grave, intoxication).","Pâleur, peau froide et marbrée, sueurs, soif, pouls rapide et filant, vertiges en position assise/debout.","TRC <b>> 2 s</b> · FC <b>> 120</b> au repos ou <b>< 40</b> · PAS <b>< 90 mmHg</b> ou <b>diminuée de plus de 30 %</b> chez l’hypertendu.","Signes d’installation : accélération du pouls, allongement du TRC, <b>pincement</b> puis chute de la PA.","CAT : arrêter la cause, <b>allonger à plat</b>, O₂, <b>réchauffer</b>, surveiller conscience, FC, PA. Toute mobilisation peut déclencher l’ACR."]],
 ["Neurologique",["Causes : trauma crânien, AVC, intoxications, <b>hypoglycémie</b>.","PC, confusion, agitation, paralysie, perte de la vue, convulsions, asymétrie du visage ou des <b>pupilles</b>.","Perdu connaissance et non réactive à la voix = détresse neurologique.","Signes d’installation : aggravation du niveau de conscience, PC passagère, trouble isolé de la parole.","CAT : allonger, O₂ si nécessaire, surveiller l’état neurologique, glycémie."]]
],
o:["« Détresse circulatoire : FC 132, PA 85/50, TRC 4 s. On l’allonge à plat, MHC, couverture, et je demande le SMUR. »"],
p:["Des mesures « encore normales » mais qui se dégradent d’une surveillance à l’autre = détresse en constitution.","Chez l’hypertendu, 110 de systolique peut déjà être une chute de plus de 30 %."]},

{id:"o2",ch:"detr",t:"Oxygène : indications, débits, objectifs",src:"RTN 05FT01 p.113-115",
cle:"Inhalation si FR > 6. Indications : détresse respiratoire ou circulatoire, fumées/CO, plongée, SpO₂ < 94 % (< 89 % chez l’IRC), crise drépanocytaire. MHC 15 L/min d’emblée (plage 15-9), masque simple 9 (9-6), lunettes 2 L/min ou débit habituel + 1-2 (6-1). Objectif 94-98 %, 89-94 % chez l’IRC. Fumées, CO, accident de décompression : MHC 15 L/min quelle que soit la SpO₂.",
b:[
 ["Indications de l’inhalation",["Victime qui respire : <b>FR > 6</b>/min.","Détresse <b>respiratoire</b> ou <b>circulatoire</b>.","Intoxication aux <b>fumées</b> ou au <b>CO</b> ; accident de <b>plongée</b>.","SpO₂ <b>< 94 %</b> ; <b>< 89 %</b> chez l’insuffisant respiratoire chronique (avec ou sans O₂ à domicile).","Crise douloureuse chez le <b>drépanocytaire</b>.","SpO₂ impossible à mesurer + détresse vitale : O₂ <b>systématique</b> jusqu’à l’avis médical."]],
 ["Dispositifs et débits",["<b>MHC</b> : débit initial <b>15 L/min</b>, plage 15 à 9. Sous 5 L/min : résistance et ré-inhalation du CO₂.","<b>Masque simple</b> : initial <b>9 L/min</b>, plage 9 à 6.","<b>Lunettes</b> : <b>2 L/min</b> ou 1-2 L/min de plus que le débit habituel, plage 6 à 1 ; indiquées pour l’IRC (cible 89-94 %) ; irritation au-delà de 4 L/min sans humidification.","Masque laryngectomisé : débit adapté à la saturation, durée limitée, aspiration souvent nécessaire."]],
 ["Objectifs et pièges",["Cible <b>94-98 %</b> (adulte, enfant, nourrisson) ; <b>89-94 %</b> chez l’IRC.","<b>Fumées, CO, accident de décompression</b> : MHC 15 L/min quelle que soit la SpO₂.","Détresse avec SpO₂ non mesurable (pas de pouls périphérique, hypothermie) : MHC 15 L/min quels que soient les antécédents.","L’<b>hyperoxie</b> peut nuire (AVC, maladie cardiaque avec SpO₂ normale, IRC avancée) : lutter contre l’hypoxie sans créer d’hyperoxie."]]
],
o:["« SpO₂ 86 % chez un BPCO sous 1 L/min à domicile : je passe ses lunettes à 2-3 L/min et je vise 89-94 %. »"],
p:["Douleur thoracique avec SpO₂ à 97 % : pas d’O₂ « pour le principe ».","Intoxiqué au CO à 99 % au saturomètre : MHC 15 L/min quand même."]},

/* ============ MALAISES ============ */
{id:"malaise",ch:"malaise",t:"Malaise : conduite à tenir de base",src:"RTN 06AC01 · 06PR01 · 06FT01-03 p.175-183",
cle:"Soustraire aux facteurs déclenchants, position d’attente (allongée ; assise si difficultés à respirer ; sinon celle où elle se sent le mieux), bilan, aide au traitement ou au sucre, rassurer, avis médical, surveiller l’aggravation.",
b:[
 ["Conduite à tenir",["Traiter d’abord toute urgence vitale.","Soustraire aux facteurs déclenchants.","Position : <b>allongée</b> ; <b>assise</b> si difficultés à respirer ; sinon <b>celle où elle se sent le mieux</b>.","Aider à dégrafer les vêtements ; à sa demande ou à celle des secours : son <b>traitement prescrit</b>, du <b>sucre</b> en morceaux.","Rassurer, transmettre pour avis, appliquer les consignes, protéger, surveiller.","Signes infectieux : mesures barrières, distance, isolement.","Malaise <b>vagal ou orthostatique</b> connu : <b>manœuvres physiques</b> (contre-pression)."]],
 ["Positions d’attente et de transport",["<b>À plat dos</b> : position courante ; détresse circulatoire, RCP, <b>AVC</b>.","<b>Assise / demi-assise</b> : détresse ou gêne respiratoire.","<b>Allongée sur le côté</b> : vomissements, femme enceinte en fin de grossesse ou en imminence d’accouchement.","<b>Cuisses fléchies, jambes repliées</b> : contusion, plaie grave de l’abdomen, violentes douleurs abdominales.","Plus la <b>PLS</b> pour la victime qui a perdu connaissance et respire."]]
],
o:["« Monsieur, vous restez assis, c’est là que vous respirez le mieux ; vous prenez votre spray habituel ? »"],
p:["Le secouriste n’administre pas : il aide la victime à prendre son traitement, à sa demande ou à celle du médecin.","Les manœuvres physiques sont pour un malaise vagal ou orthostatique connu, pas pour tout malaise."]},

{id:"avc",ch:"malaise",t:"Douleur thoracique, AVC, convulsions",src:"RTN 06AC02-04 · 06PR02-04 p.184-192",
cle:"Douleur thoracique sans détresse : CAT malaise + ECG. AVC/AIT : strictement à plat (PLS si nausées/vomissements), glycémie au 4e regard, heure de début, avis médical, unité neurovasculaire. Convulsions : protéger, ne rien mettre dans la bouche, noter heure et durée, glycémie ; nourrisson : température et refroidissement.",
b:[
 ["Douleur thoracique non traumatique",["Appliquer la CAT malaise et réaliser un <b>ECG</b> (SP habilités).","Interrogatoire PQRST : constrictive, irradiation (bras, mâchoire, dos), durée, effort, antécédents et facteurs de risque."]],
 ["AVC / AIT",["Position <b>strictement horizontale à plat</b>, ou <b>PLS</b> si nausées et vomissements.","4e regard : <b>glycémie capillaire</b> (une hypoglycémie peut mimer un AVC), signes, facteurs de risque, antécédents, traitements (anticoagulants).","Heure de début des signes (ou dernière fois vue normale) : décisive.","Avis médical et maintien de la position pendant le transport ; orientation idéale <b>USINV / UNV</b>.","AIT : signes régressifs, même prise en charge."]],
 ["Crise convulsive généralisée",["Début : allonger au sol, écarter les personnes.","Pendant : protéger la tête (vêtement plié), écarter les objets, <b>ne rien mettre dans la bouche</b>, ne jamais contraindre les mouvements.","Après : VA libres, respiration, CAT adaptée, rassurer, <b>glycémie</b>.","Noter <b>heure et durée</b>, rechercher un traumatisme, transmettre, surveiller jusqu’au retour à la normale.","<b>Nourrisson</b> : prendre la <b>température</b>, refroidissement actif, bilan <b>systématique</b>."]]
],
o:["« FAST positif, bras gauche qui retombe depuis 10 h 15, glycémie 1,10 g/L. On reste à plat, je demande l’avis. »"],
p:["Un AVC ne se met pas en demi-assis « pour le confort » : à plat strict.","Pas de canule, pas de stylo dans la bouche d’un convulsant."]},

{id:"asthme",ch:"malaise",t:"Asthme, hypoglycémie, allergie grave",src:"RTN 06AC05-07 · 06PR05-07 p.193-200",
cle:"Asthme : soustraire au déclencheur, O₂ si besoin, garder la position. Hypoglycémie consciente et capable d’avaler (glycémie < 0,6 g/L ou origine inconnue) : 4 morceaux de sucre adulte, 2-3 enfant ; réévaluer à 15 min. Allergie grave avec détresse : retirer l’allergène, auto-injecteur à la demande de la victime ou du régulateur, 2e injection possible si pas d’amélioration ou récidive à 5 min.",
b:[
 ["Crise d’asthme",["Soustraire au déclencheur (fumée, pollution, poussière).","Aider à prendre son traitement ; O₂ si nécessaire ; surveiller la respiration.","Position conservée pendant le transport (souvent assise).","Asthme aigu grave chez l’asthmatique connu : aérosol médicamenteux possible par SP habilité, sur prescription."]],
 ["Hypoglycémie du diabétique",["A perdu connaissance et respire : glycémie au 4e regard, avis médical avec le résultat. <b>Rien par la bouche</b>.","Consciente, <b>réactive et capable d’avaler</b>, et glycémie <b>< 3,3 mmol/L</b> (< 0,6 g/L) <b>ou origine inconnue</b> : sucre.","De préférence <b>sucre en morceaux ou en poudre</b> : <b>4</b> morceaux/cuillères à café adulte, <b>2 à 3</b> enfant ; sinon boisson sucrée (jus d’orange), miel, bonbons au sucrose.","Avis médical si pas d’amélioration rapide ou doute ; réévaluer à <b>15 min</b>.","Glucagon par auto-injecteur : acte thérapeutique sur prescription."]],
 ["Réaction allergique grave",["Signes de détresse : souffle court, sifflements, œdème des VA, gonflement ; malaise, pouls rapide, PA basse ; urticaire étendue.","Éliminer le contact avec l’allergène si connu.","Traitement personnel : administrer <b>à la demande de la victime ou du régulateur</b>, avis médical immédiat, surveiller.","Pas d’amélioration ou récidive <b>dans les 5 minutes</b> : <b>2e injection</b> possible, si possible après nouvel avis.","Réaction simple : avis médical ; le régulateur peut quand même demander l’injection."]]
],
o:["« Glycémie 0,42 g/L, il avale bien : je lui donne 4 sucres et je recontrôle dans 15 minutes. »"],
p:["Origine du malaise inconnue chez un diabétique conscient : on peut donner le sucre sans attendre la glycémie.","Le sucre chez la victime qui ne peut pas avaler : jamais."]},

/* ============ TRAUMATISMES ============ */
{id:"brulures",ch:"trauma",t:"Brûlures",src:"RTN 07AC01 · 07PR01 p.201-204",
cle:"Refroidir immédiatement à l’eau courante tempérée, faible pression, au moins 10 minutes (idéalement 20), si brûlure de moins de 30 minutes, victime consciente, sans détresse circulatoire, surface < 20 % adulte / < 10 % enfant-nourrisson. Paume + doigts de la victime = 1 %. Brûlure grave : avis médical dès le début de l’arrosage.",
b:[
 ["Gravité",["Superficielle : rouge, sèche, douloureuse. Profonde : <b>cloques</b>, aspect humide. Très profonde : pâleur <b>cireuse</b>, noirâtre, souvent <b>peu douloureuse</b>.","Étendue : règle de <b>Wallace</b> (adulte) ; <b>paume + doigts de la victime = 1 %</b> quel que soit l’âge.","<b>Grave</b> si : cloques > <b>moitié de la paume</b> de la victime ; destruction profonde ; aspect <b>circulaire</b> ; visage, cou, mains, articulations, orifices naturels ; rougeur étendue chez l’enfant ; origine chimique, électrique ou radiologique.","Voies aériennes : traces noires narines/bouche/langue, voix rauque."]],
 ["Brûlure thermique",["Soustraire à la cause.","<b>Refroidir</b> en retirant vêtements (s’ils n’adhèrent pas) et bijoux, eau <b>courante tempérée</b>, <b>faible pression</b>, <b>≥ 10 min, idéalement 20</b>.","Conditions : brûlure de <b>moins de 30 min</b> + consciente + pas de détresse circulatoire + surface <b>< 20 %</b> adulte, <b>< 10 %</b> enfant/nourrisson. Après 30 min : pas d’intérêt.","À défaut d’eau : compresses enduites de gel d’eau. Jeune enfant arrosé : surveiller le refroidissement excessif.","Grave : avis médical <b>dès le début de l’arrosage</b> ; ne pas percer les cloques ; pansement, champ stérile ou <b>film plastique non adhésif</b> ; drap stérile si très étendue ; <b>couverture isotherme</b>.","Simple : refroidir jusqu’à disparition de la douleur ; consulter si tétanos non à jour, enfant/nourrisson, infection."]],
 ["Électrique, chimique, inhalation",["Électrique : jamais toucher avant suppression du risque ; arroser les zones visiblement brûlées ; CAT brûlure grave.","Chimique : se protéger ; rincer immédiatement et abondamment, ôter sous l’eau les vêtements imbibés ; œil : rincer, retirer les lentilles pendant le rinçage.","Ingestion : <b>ne jamais faire vomir ni boire</b>, conserver l’emballage."]]
],
o:["« Brûlure de l’avant-bras il y a 10 minutes, environ 3 % : on arrose 20 minutes et je te passe le bilan pendant l’arrosage. »"],
p:["Eau glacée ou jet fort : non. Eau tempérée, faible pression.","Grand brûlé à 40 % : on n’arrose pas tout le corps, on emballe et on lutte contre l’hypothermie."]},

{id:"plaies",ch:"trauma",t:"Plaies, amputation, membres",src:"RTN 07PR02-03 · 07FT04 · 07PR07 p.205-238",
cle:"Amputation : arrêter l’hémorragie, pansement compressif même sans saignement, segment enveloppé dans un pansement humidifié, sac étanche dans un 2e sac d’eau glacée, jamais au contact de la glace, nom et heure. Membre : ne pas mobiliser, immobiliser, froid sauf fracture ouverte, respecter la déformation.",
b:[
 ["Amputation, arrachement",["Arrêter l’hémorragie ; <b>pansement compressif</b> sur le moignon <b>même sans saignement</b>.","Segment : récupérer vite, envelopper dans un pansement stérile ou tissu propre <b>humidifié</b> (sérum ou eau), sac étanche, dans un <b>2e sac</b> avec glace ou eau glacée.","<b>Jamais de contact direct</b> avec la glace, ne pas congeler. Noter <b>nom</b> et <b>heure</b>. Il part avec la victime."]],
 ["Traumatisme de membre",["Conseiller fermement de ne pas bouger, limiter les mouvements.","Position : membre inférieur → <b>allongée</b> ; membre supérieur → <b>assise</b>, membre contre la poitrine.","Immobiliser avec l’attelle la plus appropriée ; <b>froid</b> sauf fracture ouverte.","Fracture ouverte : ne pas toucher l’os ; pansement stérile avant l’immobilisation.","Déformation : immobiliser <b>en respectant la déformation</b> ; le réalignement se fait par ou à la demande du médecin."]],
 ["Plaies graves (rappel)",["Thorax : position demi-assise ; abdomen : cuisses fléchies ; œil : allongé tête calée, ne pas toucher.","Corps étranger : ne jamais le retirer."]]
],
o:["« Je te prépare le sac : doigt dans la compresse mouillée, sac fermé, puis dans le sac d’eau glacée, 15 h 05 marqué dessus. »"],
p:["Doigt amputé posé directement sur la glace : lésions de gelure, réimplantation compromise.","Le froid est contre-indiqué sur une fracture ouverte."]},

{id:"rachis",ch:"trauma",t:"Traumatisme du dos et du cou : décider d’immobiliser",src:"RTN 07AC08 · 07PR08 p.239-245",
cle:"Détresse vitale d’abord : l’immobilisation du rachis ne passe jamais avant. Arbre : réponses non fiables, signes rachidiens ou médullaires, traumatisme à haut risque, ou > 65 ans / antécédents à risque → immobilisation corps entier. Plaie pénétrante isolée tête-cou-thorax : on n’immobilise pas, on évacue.",
b:[
 ["Arbre décisionnel",["(A) Réponses <b>non fiables</b> : détresse vitale, conscience altérée, non coopération, alcool/drogues, <b>douleur distrayante</b>.","(B) Signes rachidiens : douleur spontanée, à la mobilisation ou à la palpation, raideur de nuque, déformation.","(C) Signes médullaires : force ou sensibilité diminuée, paresthésies, perte d’urines/selles, priapisme.","(D) Haut risque : chute sur la tête <b>> 1 m</b> (plongeon), chute sur pieds/fesses <b>> 3 m</b>, véhicule à grande vitesse ou <b>> 40 km/h avec arrêt brutal < 10 m</b>, airbags, retournement, éjection, deux-roues, piéton renversé, chute de cheval, loisirs motorisés.","(E) <b>> 65 ans</b> ou antécédents : traumatisme vertébral ancien, chirurgie, ostéoporose.","Non fiable → immobilisation. Fiable : B ou C → immobilisation ; sinon D → immobilisation si oui ; sinon E oui → immobilisation ; sinon pas d’immobilisation."]],
 ["Conduite à tenir",["Limiter les mouvements du rachis à toutes les étapes (consigne ou stabilisation).","Détresse vitale : traiter d’abord, demander à la victime de ne pas bouger, avis médical.","Sans détresse : ne pas bouger, maintien tête si possible, <b>retirer le casque</b>, immobilisation selon l’arbre.","Plaie pénétrante isolée thorax/cou/tête : <b>ne pas perdre de temps</b> à immobiliser.","Victime agitée non coopérante : ne pas forcer, maintien à 2 mains si possible, avis médical.","Déformation préexistante, très âgé : respecter la position, calages."]]
],
o:["« Il est fiable, aucune douleur, pas de signe neuro, chute de sa hauteur, 52 ans : pas d’immobilisation du rachis, on le note. »"],
p:["Un collier n’est pas un réflexe : c’est l’arbre qui décide.","Une fracture du fémur très douloureuse rend les réponses non fiables (douleur distrayante)."]},

{id:"crane",ch:"trauma",t:"Crâne, bassin, thorax, abdomen",src:"RTN 07PR04-10 · 07FT16 p.217-266",
cle:"Crâne : tête en position neutre, retirer le casque, O₂ si besoin, surveiller (aggravation brutale). Bassin : allongé strict, examen en préservant l’intimité, contention pelvienne si détresse circulatoire (après avis ou si avis impossible), matelas à dépression.",
b:[
 ["Traumatisme du crâne",["Maintien de la tête en position neutre, retrait du casque.","O₂ si nécessaire ; stabiliser ou restreindre les mouvements du rachis cervical si besoin.","Surveiller conscience, pupilles, vomissements, PC initiale : risque d’<b>aggravation brutale</b>."]],
 ["Traumatisme du bassin",["Position <b>allongée stricte</b>.","Dénuder en préservant l’intimité : lésions, sang sur les sous-vêtements ; dos et fesses lors des mobilisations.","<b>Contention pelvienne</b> si traumatisme du bassin + <b>signes de détresse circulatoire</b> : après avis médical, ou si l’avis est impossible.","Protéger du froid, relever et immobiliser sur <b>matelas à dépression</b>, surveiller (aggravation brutale)."]],
 ["Thorax et abdomen",["Thorax : demi-assis si conscient, O₂, plaie soufflante non obturée de façon étanche ; ne pas retirer un corps étranger.","Abdomen : cuisses fléchies, jambes repliées ; éviscération : ne pas remettre en place, champ humide."]]
],
o:["« Contention pelvienne posée à 16 h 20 après avis, au niveau des grands trochanters. »"],
p:["On ne « teste » pas la stabilité du bassin en le comprimant.","Contention pelvienne sans signe de détresse circulatoire : pas l’indication."]},

/* ============ CIRCONSTANCIELLES ============ */
{id:"noyade",ch:"circ",t:"Noyade",src:"RTN 08AC02 · 08PR02 p.271-274",
cle:"Détresse respiratoire par immersion/submersion. Sortir vite, lésion du rachis très peu probable. Isolé : 5 cycles de RCP avant d’aller alerter. Compressions seulement hors de l’eau. O₂ 15 L/min systématique. Pas de claques ni de compressions abdominales ; la mousse ne gêne pas.",
b:[
 ["Sauvetage",["Alerter les secours spécialisés ; éviter d’entrer dans l’eau ; sinon bouée/flottaison, jamais seul, pas de plongeon tête la première.","Lancer un objet (bouée, bâton, corde, vêtement), sinon embarcation.","Sortir <b>rapidement</b> : lésion de la colonne <b>très peu probable</b>. En ACR : sortie la plus rapide possible en limitant flexion/extension du cou.","Immobilisation avant la sortie (spécialistes) seulement dans de rares cas : plongeon en eau peu profonde, accident de sport nautique avec signes."]],
 ["Spécificités en ACR",["Secouriste isolé : <b>5 cycles de RCP</b> avant de quitter la victime pour alerter.","Compressions seulement <b>hors de l’eau</b> (terre ou embarcation).","O₂ <b>15 L/min</b> rapide et systématique tant qu’ACR et SpO₂ non fiable.","<b>Sécher le thorax</b> avant les électrodes.","<b>Pas de désobstruction</b> (claques, compressions abdominales) : dangereuse, retarde la RCP. La <b>mousse</b> aux lèvres ne gêne pas.","Régurgitation : tourner sur le côté, vider, aspirer (d’un bloc si lésion cervicale suspectée)."]],
 ["Victime consciente",["Position où elle se sent le mieux, à l’abri du vent.","Déshabiller sans mobilisation intempestive, sécher <b>sans friction</b>, couvertures.","Bilan complet nécessaire avant toute verticalisation après immersion prolongée."]]
],
o:["« Sorti de l’eau, ne respire pas : je masse, toi tu sèches le thorax et tu colles le DAE, O₂ à 15. »"],
p:["Vider l’eau des poumons : non, ni claques ni Heimlich.","Le collier systématique sur toute noyade : non, lésion du rachis très peu probable."]},

{id:"chaleur",ch:"circ",t:"Chaleur, hypothermie, électrisation",src:"RTN 08PR01 · 08PR06-07 · 08FT03 p.268-297",
cle:"Chaleur : refroidissement passif toujours ; coup de chaleur et hyperthermie maligne d’effort : refroidissement actif avancé (immersion eau froide/glacée, tête hors de l’eau, eau remuée) jusqu’à disparition des signes neuro et T < 39 °C. Hypothermie < 35 °C : légère 35-32, modérée 32-28, sévère 28-24, grave < 24 °C (ACR apparent).",
b:[
 ["Affections liées à la chaleur",["Toujours <b>refroidissement passif</b> : soustraire, endroit frais, retirer les vêtements superflus, limiter l’effort.","Sans détresse : position d’attente, réhydrater (eau, mieux liquide avec glucides et sels, sauf vomissements).","Crampe : glace, étirements doux, massages, pas de reprise avant disparition.","Insolation : refroidissement actif <b>simple</b>.","<b>Coup de chaleur / hyperthermie maligne d’effort</b> : refroidissement actif <b>avancé</b> : <b>immersion</b> dans l’eau fraîche, froide ou glacée, tête hors de l’eau, eau <b>remuée</b> ; avis sans délai.","Arrêt : disparition des signes neurologiques <b>et</b> T < <b>39 °C</b>."]],
 ["Hypothermie (< 35 °C)",["<b>Légère 35-32 °C</b> : consciente, FR et FC rapides, frissons, peau froide.","<b>Modérée 32-28 °C</b> : délire, troubles de conscience, ralentissement, <b>plus de frissons</b>, rigidité modérée.","<b>Sévère 28-24 °C</b> : PC, pouls difficile à percevoir, très sensible aux mobilisations (troubles du rythme, ACR).","<b>Grave < 24 °C</b> : arrêt cardiaque apparent.","Mobilisations douces, à l’horizontale ; retirer les vêtements mouillés, isoler, réchauffer."]],
 ["Électrisation",["Ne pas toucher avant suppression du risque.","Brûlures d’entrée et de sortie, troubles du rythme possibles : avis médical, surveillance."]]
],
o:["« Coureur confus à l’arrivée, 41 °C : on le plonge dans le bac d’eau glacée, la tête dehors, et on remue l’eau. »"],
p:["L’absence de frissons chez un hypotherme n’est pas un bon signe : c’est l’hypothermie modérée ou pire.","Le refroidissement ne s’arrête pas dès que la victime « va mieux » : signes neuro disparus ET < 39 °C."]},

{id:"accouch",ch:"circ",t:"Accouchement inopiné et nouveau-né",src:"RTN 08AC04 · 08PR04-05 p.279-288",
cle:"Nouveau-né posé peau contre peau sur le ventre de sa mère, sur le côté, tête dégagée. En bonne santé (cri vigoureux, tonus vif) : clamper le cordon au minimum après 1 minute de vie, sécher, envelopper tête et corps sauf la face, bonnet, couvrir la mère.",
b:[
 ["Nouveau-né",["Peau contre peau, sur le côté, tête bien dégagée ; gants propres.","Apprécier le <b>cri/respiration</b> et le <b>tonus</b>. Pâleur → à signaler.","En bonne santé : clamper au minimum <b>après 1 minute</b> de vie, puis couper possible.","Sécher <b>par tamponnement</b> avec serviette tiède, envelopper tête et corps sauf la face, bonnet, sac polyéthylène possible.","Transport : système fermé et fixé.","Ne respire pas : ouvrir les VA, sécher, stimuler ; si inchangé, insufflations à l’air (40/min) ; pas de soulèvement après les 5 premières → vérifier VA et étanchéité. FR normale nouveau-né 40-60, FC 120-160."]],
 ["Mère",["Imminence : position allongée sur le côté gauche pour le transport en fin de grossesse.","Délivrance et saignement : surveillance, <b>massage utérin</b> selon la fiche si hémorragie après délivrance."]]
],
o:["« Bébé né à 3 h 12, cri vigoureux, bon tonus, peau contre peau, cordon clampé à 3 h 14. »"],

/* ============ SITUATIONS PARTICULIÈRES ============ */
{id:"particu",ch:"situ",t:"Situations particulières (GDO)",src:"GDO SSUAP ch.5 §3 p.52-62",
cle:"Pas de gestes si tête séparée, rigidité/putréfaction, ACR parmi de nombreuses victimes sans moyens suffisants, refus de la famille (non-acharnement), danger imminent insoustrayable. Psychiatrie sans consentement : médecin sur place obligatoire avant tout transport. Mineur non accompagné : sous la responsabilité des SP, ne peut refuser.",
b:[
 ["Pas d’actions de secours",["Tête séparée du tronc ; <b>raideur cadavérique ou putréfaction</b>.","Situation exceptionnelle : ACR au milieu de nombreuses victimes nécessitant aussi des gestes de survie, moyens insuffisants.","Refus de la famille invoquant le <b>non-acharnement</b> ; danger imminent sans possibilité de soustraire.","Présence médicale parfois nécessaire même si mort avérée (contrainte sociale forte, témoins : suicide par arme, défenestration, mort subite du nourrisson).","Fin de vie à domicile : le CA contacte le régulateur ; adhésion complète à sa décision ; ne pas laisser un proche seul."]],
 ["Psychiatrie, crise, troubles du comportement",["Exception au consentement : soins à la demande d’un tiers, péril imminent, décision du préfet.","<b>Présence physique d’un médecin</b> et examen <b>indispensables avant tout transport</b> sans consentement : le CA contacte le SAMU.","Abord : ne pas soutenir le regard ni contredire, isoler de l’entourage aggravant, dire ce qu’on fait, questions ouvertes, <b>éviter les « pourquoi »</b>, suivre son rythme, l’amener à venir vers nous.","<b>Contention physique = forces de l’ordre</b> ; maintien provisoire possible pour la sécurité."]],
 ["Personnes vulnérables",["<b>Mineur</b> non émancipé : sous la responsabilité des SP à défaut de représentant légal ; récupérer la fiche sanitaire en collectivité ; ne peut pas refuser ; seul et non évacué → représentant légal, forces de l’ordre ou adulte en ayant la garde, sinon régulateur.","<b>IPM</b> : bilan complet systématique, surveillance, ne pas tomber dans la routine ; évolution possible vers détresse et mort subite.","<b>VIF</b> : attention au comportement de la victime et du conjoint (répond à sa place, minimise) ; consigner et rendre compte au supérieur en vue d’un signalement.","<b>Handicap</b> : s’adresser à la personne, demander comment aider, ne pas toucher l’animal d’assistance, permission avant de toucher le fauteuil.","Personne <b>fragile</b> qui refuse la mise à l’abri : tout faire, avec le régulateur, pour la persuader ; signaler l’isolement au CTA-CODIS."]],
 ["Porte fermée, scène de crime, religion",["Personne ne répondant pas : confirmer le logement, <b>ne pas sonner ni appeler</b>, ne pas rester devant la porte, solliciter les forces de l’ordre, entrer de préférence par une <b>fenêtre</b> (cuisine plutôt que chambre), s’annoncer à chaque étape, reconnaissance complète (placards, garage, cave, voiture).","Traces et indices : limiter le nombre d’intervenants, <b>cheminement unique</b>, mémoriser ce qu’on a déplacé ; les soins priment (art. 55 CPP).","Convictions : neutralité ; elles ne priment jamais sur les soins, l’hygiène ou la sécurité. Le choix du praticien ne s’applique pas en urgence."]]
],
o:["« On n’entre pas par la porte palière : la fenêtre de la cuisine est entrouverte, police prévenue, on s’annonce. »"],
p:["Sonner et téléphoner avant d’entrer chez une personne qui ne répond pas : non (risque, et ça ne prouve rien).","Le SP ne contient pas physiquement un patient agité : forces de l’ordre."]},

{id:"novi",ch:"situ",t:"Nombreuses victimes : repérage et ORSEC NOVI",src:"RTN 11AC01 · 11FT01 p.373-376 · GDO §5 p.63-66",
cle:"Repérage dès que les victimes apparemment graves sont plus nombreuses que les secouristes. Victime la plus proche d’abord. Décès certain → noir. Hémorragie → la traiter. PC → LVA ; respire → PLS (rouge), ne respire pas → noir. Détresse vitale → rouge ; incapacité à se déplacer → jaune ; sinon vert au PRV.",
b:[
 ["Premier engin",["Évaluer : nature et localisation, circonstances, nombre et état présumés, <b>PRM</b> et <b>PRV</b> provisoires.","Premier tri : décédés laissés sur place ; blessés graves → gestes de survie, damage control ; blessés légers et impliqués regroupés <b>ailleurs</b> que les blessés graves.","<b>Damage control</b> : arrêter les grandes hémorragies, sécuriser les VA, sans traiter tout le reste."]],
 ["Arbre de repérage",["Aborder les victimes une à une en commençant par la <b>plus proche</b>.","Décès ne fait pas de doute → <b>NOIR</b>, ne pas déplacer.","<b>Hémorragie</b> → la traiter.","<b>Perte de connaissance</b> → LVA ; respire → <b>PLS</b>, couvrir, <b>ROUGE</b> ; ne respire pas → NOIR.","Consciente avec <b>détresse vitale</b> → position d’attente, <b>ROUGE</b>, sur place.","<b>Incapacité à se déplacer</b> → laisser dans sa position, <b>JAUNE</b>. Sinon → <b>VERT</b>, envoyée au <b>PRV</b>."]],
 ["NOVI et SINUS",["ORSEC NOVI : sous l’autorité du préfet (DO) ; secours, impliqués, dénombrement, identification, suivi, familles.","<b>SINUS</b> : numéro unique par victime (bracelet, fiche) : exhaustivité, pas de doublon, traçabilité.","Le dénombrement marque le début de la prise en charge globale et fonde la demande de renforts."]]
],
o:["« CODIS, VSAV 1 sur place : bus couché, une quarantaine d’impliqués, au moins six victimes graves apparentes, PRM au rond-point, PRV au gymnase. »"],
p:["On ne masse pas un ACR quand d’autres victimes ont besoin de gestes de survie et que les moyens manquent.","Les verts ne restent pas au contact des rouges : on les regroupe au PRV."]}
];

{th:"cadre",ty:"qcm",q:"Pendant l’évacuation, l’état de la victime s’aggrave à 3 minutes de l’hôpital. Tu :",o:["Refais un bilan et recontactes en urgence le régulateur","Continues, tu le diras à l’IAO","Accélères sans prévenir","Demandes au conducteur de s’arrêter et attends le SMUR"],a:0,x:"Nouveau bilan et recontact quelle que soit la distance ; le médecin propose : poursuivre en prévenant, suspendre dans l’attente d’un moyen médicalisé, ou point de jonction.",s:"GDO SSUAP §2.4 p.50"},
