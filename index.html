function isCorrect(P){
  const q=P.q;
  if(q.ty==="ordre") return P.seq.length===q.o.length && P.seq.every((v,i)=>v===i);
  if(q.ty==="vf") return P.picked[0]===(q.a?0:1);
  if(q.ty==="qcm") return P.picked[0]===q.a;
  if(q.ty==="lance") return ["d","j","g"].every(k=>q.a[k].includes(P.sel[k]));
  if(q.ty==="expl") return P.kk.length >= Math.ceil(q.k.length*0.6);
  const a=[...q.a].sort().join(), b=[...P.picked].sort().join(); return a===b;
}
function answer(timeout, c){
  const R=cur.run; const P=R.list[R.i]; if(P.done) return;
  P.done=true; P.timeout=!!timeout; P.c = c||null; P.ok = timeout ? false : isCorrect(P);
  const r = S.q[P.q.id] || {n:0,ok:0,last:null,box:0,s:0,so:0}; r.n++; if(P.ok) r.ok++; r.last=P.ok;
  if(r.box==null) r.box=0;
  if(P.c==="s"){ r.s=(r.s||0)+1; if(P.ok) r.so=(r.so||0)+1; }
  if(P.ok){
    if(P.c==="g") r.box = 1;
    else if(P.c==="h") r.box = Math.max(1, Math.min(r.box, 2));
    else r.box = Math.min(r.box+1, GAPS.length-1);
    r.due = today() + GAPS[r.box];
    if(P.c==="s" || P.c==null) r.dz = false;
  } else {
    r.box = 0; r.due = today()+1;
    if(P.c==="s") r.dz = true;
  }
  S.q[P.q.id]=r; markDay(); save();
  R.answers.push(P);
  stopTimer();
  if(R.mode==="exam"){ next(); return; }
  render();
  const fb=$(".fb"); if(fb) fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){
  const R=cur.run; const P=R.list[R.i];
  if(R.mode==="sudden" && P && P.done && !P.ok){ finish(); return; }
  R.i++;
  if(R.i>=R.list.length){ finish(); return; }
  render(); window.scrollTo(0,0);
}
function finish(){
  stopTimer();
  const R=cur.run; if(R.mode==="jour" && R.answers.length){ S.lastDaily=today(); save(); }
  cur={tab:"quiz", result:{mode:R.mode, answers:R.answers, total:R.mode==="sudden"?R.answers.length:R.list.length, t:Math.round((Date.now()-R.t0)/1000)}};
  render(); window.scrollTo(0,0);
}
function repText(q){
  if(q.ty==="qcm") return q.o[q.a];
  if(q.ty==="multi") return q.a.map(i=>q.o[i]).join(" · ");
  if(q.ty==="vf") return q.a?"Vrai":"Faux";
  if(q.ty==="lance") return ["d","j","g"].map(k=>q.a[k].map(i=>LANCE_OPT[k][i]).join(" ou ")).join(" — ");
  if(q.ty==="expl") return q.k.join(" · ");
  return q.o.map((t,i)=>(i+1)+". "+t).join("  ");
}
function vResult(){
  const Rr=cur.result; const good=Rr.answers.filter(a=>a.ok).length; const tot=Rr.total;
  const pct = tot?Math.round(good/tot*100):0;
  const sure=Rr.answers.filter(a=>a.c==="s"), sureBad=sure.filter(a=>!a.ok).length;
  let verdict;
  if(Rr.mode==="sudden") verdict = `Série de ${good} bonne${good>1?"s":""} réponse${good>1?"s":""} d’affilée.`;
  else verdict = pct>=85?"Niveau équipier SUAP solide. Garde ce rythme.":pct>=70?"Bien. Reprends les erreurs ci-dessous.":pct>=50?"Des bases, mais trop de trous pour être serein en intervention.":"À retravailler : relis les fiches du thème puis relance.";
  let html = `<section class="card" style="text-align:center"><div class="eyebrow">${esc(MODES[Rr.mode][0])}</div><div class="score">${Rr.mode==="sudden"?good:pct+" %"}</div><p style="margin:6px 0 0;font-weight:700">${verdict}</p><p class="muted" style="margin:4px 0 0">${good} / ${tot} · ${Math.floor(Rr.t/60)} min ${Rr.t%60} s${sure.length?` · ${sure.length-sureBad}/${sure.length} justes quand tu étais sûr`:""}</p>${sureBad?`<div class="danger-note" style="text-align:left;margin-top:10px">${sureBad} piège${sureBad>1?"s":""} de confiance sur cette série : ce sont les connaissances fausses qui « tiennent » le mieux. Elles reviennent en priorité.</div>`:""}</section>
  <div class="row"><button class="btn primary" data-act="restart">Relancer</button>${errorsList().length?`<button class="btn" data-act="errors">Revoir mes erreurs (${errorsList().length})</button>`:""}<button class="btn ghost" data-act="setup">Réglages</button></div>`;
  const wrong = Rr.answers.filter(a=>!a.ok);
  if(wrong.length){
    html += `<h2 class="sec-title">Corrigé de tes erreurs</h2><div class="review">${wrong.map(a=>{ const q=a.q;
      return `<div class="r"><b>${esc(q.q)}</b>${a.c==="s"?' <span class="fstat rw">sûr</span>':""}<div style="margin-top:4px"><span class="muted">Réponse :</span> ${esc(repText(q))}</div><div class="muted" style="margin-top:4px">${esc(q.x)}</div><div style="margin-top:6px"><span class="src">${esc(q.s)}</span></div></div>`;
    }).join("")}</div>`;
  } else if(Rr.answers.length){ html += `<div class="card empty">Aucune erreur sur cette série.</div>`; }
  return html;
}

/* ---------- Lexique et sigles cliquables ---------- */
const ACR = {};
LEXIQUE.forEach(([k,d,t])=>{ if(t!=="a") return; k.split(" / ").forEach(x=>{ x=x.trim(); if(!/[()]/.test(x)) ACR[x]=[k,d]; }); });
const ACR_RE = new RegExp("(?<![A-Za-zÀ-ÿ0-9’'-])(" + Object.keys(ACR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")(?![A-Za-zÀ-ÿ0-9’-])","g");
function linkify(root){
  if(!root) return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    let p=n.parentElement; while(p && p!==root){ if(p.tagName==="BUTTON"||p.tagName==="SELECT"||p.tagName==="INPUT"||p.tagName==="TEXTAREA"||p instanceof SVGElement||(p.tagName==="EM"&&p.closest(".memo"))||p.classList.contains("acr")||p.classList.contains("noacr")) return NodeFilter.FILTER_REJECT; p=p.parentElement; }
    ACR_RE.lastIndex=0; return ACR_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP; }});
  const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment(); let last=0; const t=n.nodeValue; ACR_RE.lastIndex=0; let m;
    while((m=ACR_RE.exec(t))){ frag.appendChild(document.createTextNode(t.slice(last,m.index))); const s=document.createElement("span"); s.className="acr"; s.textContent=m[1]; s.dataset.acr=m[1]; s.tabIndex=0; frag.appendChild(s); last=m.index+m[1].length; }
    frag.appendChild(document.createTextNode(t.slice(last))); n.parentNode.replaceChild(frag,n);
  });
}
let popT=null;
function showPop(k){
  const e=ACR[k]; if(!e) return; let p=$("#pop");
  if(!p){ p=document.createElement("div"); p.id="pop"; p.className="pop"; p.setAttribute("role","status"); document.body.appendChild(p); }
  p.innerHTML=`<b>${esc(e[0])}</b>${esc(e[1])}`; clearTimeout(popT); popT=setTimeout(()=>p.remove(),6000);
}
document.addEventListener("click",e=>{ const a=e.target.closest(".acr"); if(a){ e.preventDefault(); e.stopPropagation(); showPop(a.dataset.acr); } else { const p=$("#pop"); if(p && !e.target.closest("#pop")) p.remove(); } },true);
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("acr")){ e.preventDefault(); showPop(e.target.dataset.acr); } });
function vLexique(){
  const q=norm(cur.lq||""); const f=cur.lf||"all";
  let list = LEXIQUE.filter(l=> f==="all" || l[2]===f).filter(l=>!q || norm(l[0]+" "+l[1]).includes(q));
  list = list.slice().sort((a,b)=>a[0].localeCompare(b[0],"fr",{sensitivity:"base"}));
  let html = `<div><div class="eyebrow">${LEXIQUE.filter(l=>l[2]==="a").length} sigles · ${LEXIQUE.filter(l=>l[2]==="t").length} termes techniques</div><h2 class="sec-title">Lexique</h2><p class="muted" style="margin:6px 0 0">Partout dans l’appli, les sigles soulignés en pointillés s’expliquent d’une touche.</p></div>
  <div class="field"><label for="inLex">Chercher un sigle ou un mot</label><input id="inLex" type="search" placeholder="ex. FGI, ZAG, ricochet" value="${esc(cur.lq||"")}" autocomplete="off"></div>
  <div class="chips"><button data-lf="all" aria-pressed="${f==="all"}">Tout</button><button data-lf="a" aria-pressed="${f==="a"}">Sigles</button><button data-lf="t" aria-pressed="${f==="t"}">Termes techniques</button></div>`;
  if(!list.length) return html + `<div class="card empty">Rien trouvé pour « ${esc(cur.lq)} ».</div>`;
  html += `<div class="lex noacr">`; let L="";
  list.forEach(([k,d])=>{ const l=k[0].toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,""); const ll=/[0-9]/.test(l)?"#":l; if(ll!==L && !q){ html+=`<div class="letter">${ll}</div>`; L=ll; } html += `<div class="li"><b>${esc(k)}</b><span>${esc(d)}</span></div>`; });
  return html + `</div>`;
}

/* ---------- Événements ---------- */
function bind(){
  const v=$("#view");
  v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>go(b.dataset.goto));
  v.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>{ setup.n=20; startQuiz("training", b.dataset.train.split(",")); });
  v.querySelectorAll("[data-fiche]").forEach(b=>b.onclick=()=>{ if(cur.tab!=="fiches"){ cur={tab:"fiches"}; try{ history.replaceState(null,"","#fiches"); }catch(e){} } cur.id=b.dataset.fiche; render(); window.scrollTo(0,0); });
  v.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>openLb(PH[cur.id]||[],+b.dataset.ph));
  v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ setup.mode=b.dataset.mode; render(); });
  v.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ const k=b.dataset.theme; setup.themes = setup.themes.includes(k)? setup.themes.filter(x=>x!==k) : setup.themes.concat(k); render(); });
  v.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ setup.n=+b.dataset.n; render(); });
  v.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    const R=cur.run, P=R.list[R.i], oi=+b.dataset.opt; if(P.done) return;
    if(P.q.ty==="multi"){ P.picked = P.picked.includes(oi)? P.picked.filter(x=>x!==oi) : P.picked.concat(oi); render(); }
    else if(useCert(R)){ P.picked=[oi]; render(); const cb=$(".certbox"); if(cb) cb.scrollIntoView({behavior:"smooth",block:"nearest"}); }
    else { P.picked=[oi]; answer(false); }
  });
  v.querySelectorAll("[data-seq]").forEach(b=>b.onclick=()=>{ const P=cur.run.list[cur.run.i]; P.seq.push(+b.dataset.seq); render(); });
  v.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ const P=cur.run.list[cur.run.i]; if(P.done) return; P.sel[b.dataset.l]=+b.dataset.v; const y=window.scrollY; render(); window.scrollTo(0,y); });
  v.querySelectorAll("[data-kk]").forEach(b=>b.onclick=()=>{ const P=cur.run.list[cur.run.i]; if(P.done) return; const i=+b.dataset.kk; P.kk = P.kk.includes(i)? P.kk.filter(x=>x!==i) : P.kk.concat(i); const y=window.scrollY; render(); window.scrollTo(0,y); });
  v.querySelectorAll("[data-cert]").forEach(b=>b.onclick=()=>answer(false,b.dataset.cert));
  v.querySelectorAll("[data-cas]").forEach(b=>b.onclick=()=>{ cur={tab:"cas",cas:+b.dataset.cas,step:0,pts:0,choice:null,order:null}; render(); window.scrollTo(0,0); });
  v.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{ if(cur.choice!=null) return; cur.choice=+b.dataset.choice; markDay(); save(); cur.pts+=CAS[cur.cas].st[cur.step].o[cur.choice].v; render(); const fb=$(".fb"); if(fb) fb.scrollIntoView({behavior:"smooth",block:"nearest"}); });
  v.querySelectorAll("[data-memo]").forEach(b=>b.onclick=()=>{ cur={tab:"memo",memo:b.dataset.memo}; try{ history.replaceState(null,"","#memo"); }catch(e){} render(); window.scrollTo(0,0); });
  v.querySelectorAll(".memo.hide em").forEach(e=>e.onclick=()=>e.classList.toggle("rv"));
  const inF=$("#inFile"); if(inF) inF.onchange=()=>{ const file=inF.files&&inF.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>{ const o=parseBackup(String(rd.result)); if(o){ cur.pending=o; render(); } }; rd.readAsText(file); };
  v.querySelectorAll("[data-ff]").forEach(b=>b.onclick=()=>{ cur.ff=b.dataset.ff; render(); });
  v.querySelectorAll("[data-fm]").forEach(b=>b.onclick=()=>{ const k=+b.dataset.fm; if(S.fm[cur.id]===k) delete S.fm[cur.id]; else S.fm[cur.id]=k; save(); render(); toast(S.fm[cur.id]===1?"Fiche marquée maîtrisée":S.fm[cur.id]===-1?"Fiche à retravailler":"Marque retirée"); });
  v.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{ cur={tab:"chiffres",cm:b.dataset.cm}; render(); });
  const sel=$("#selChap"); if(sel) sel.onchange=()=>{ cur.chap=sel.value; render(); };
  const ins=$("#inSearch"); if(ins){ ins.oninput=()=>{ cur.search=ins.value; const pos=ins.selectionStart; render(); const n=$("#inSearch"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} }; }
  v.querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{ cur.lf=b.dataset.lf; render(); });
  const il=$("#inLex"); if(il){ il.oninput=()=>{ cur.lq=il.value; const pos=il.selectionStart; render(); const n=$("#inLex"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} }; }
  v.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
  if(cur.tab==="quiz" && cur.run && cur.run.mode==="exam" && !cur.run.list[cur.run.i].done && !timerId) startTimer();
}
function act(a){
  const R=cur.run;
  switch(a){
    case "install": if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; render(); }); } break;
    case "dismiss": S.installDismissed=true; save(); render(); break;
    case "exam": setup.themes=[]; startQuiz("exam"); break;
    case "daily": startQuiz("jour"); break;
    case "banc": startQuiz("banc"); break;
    case "danger": startQuiz("danger"); break;
    case "cert": S.cert=!S.cert; save(); render(); break;
    case "memo-list": cur={tab:"memo"}; render(); window.scrollTo(0,0); break;
    case "memo-hide": S.mh=!S.mh; save(); render(); break;
    case "memo-reveal": document.querySelectorAll(".memo em").forEach(e=>e.classList.add("rv")); break;
    case "memo-known": if(S.mm[cur.memo]) delete S.mm[cur.memo]; else S.mm[cur.memo]=today(); save(); render(); toast(S.mm[cur.memo]?"Mémo marqué connu":"Marque retirée"); break;
    case "bk-file": { const txt=backupJSON(); const fname="revisions-suap-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";
      try{ const blob=new Blob([txt],{type:"application/json"}); const el=document.createElement("a"); el.href=URL.createObjectURL(blob); el.download=fname; document.body.appendChild(el); el.click(); setTimeout(()=>{ URL.revokeObjectURL(el.href); el.remove(); },1000); S.lastExport=today(); save(); render(); toast("Fichier téléchargé"); }catch(e){ copyText(txt,"Téléchargement impossible : code copié"); } break; }
    case "bk-copy": copyText(backupJSON(),"Code de sauvegarde copié"); S.lastExport=today(); save(); render(); break;
    case "bk-paste": { const t=$("#inCode"); const o=parseBackup(t?t.value.trim():""); if(o){ cur.pending=o; render(); } break; }
    case "bk-no": cur.pending=null; render(); break;
    case "bk-yes": { const keep=S.installDismissed; S=Object.assign(BLANK(), cur.pending.data); S.installDismissed=keep; save(); cur={tab:"sauvegarde"}; updateChip(); render(); toast("Progression restaurée"); break; }
    case "cas-random": { const i=casAuHasard(); cur={tab:"cas",cas:i,step:0,pts:0,choice:null,order:null}; try{ history.replaceState(null,"","#cas"); }catch(e){} render(); window.scrollTo(0,0); break; }
    case "training": setup.mode="training"; go("quiz"); break;
    case "errors": startQuiz("errors"); break;
    case "sudden": startQuiz("sudden"); break;
    case "reset": cur.confirmReset=true; render(); break;
    case "reset-no": cur.confirmReset=false; render(); break;
    case "reset-yes": { const keep=S.installDismissed, c=S.cert; S=BLANK(); S.installDismissed=keep; S.cert=c; save(); updateChip(); cur.confirmReset=false; render(); toast("Progression effacée"); break; }
    case "back-fiches": cur.id=null; render(); window.scrollTo(0,0); break;
    case "all-themes": setup.themes=[]; render(); break;
    case "start": startQuiz(setup.mode); break;
    case "quit": if(R && R.answers.length) finish(); else { stopTimer(); cur={tab:"quiz"}; render(); } break;
    case "validate": answer(false); break;
    case "undo": { const P=R.list[R.i]; P.seq.pop(); render(); break; }
    case "expl-show": { const P=R.list[R.i]; P.shown=true; render(); break; }
    case "expl-done": answer(false,null); break;
    case "next": next(); break;
    case "restart": startQuiz(cur.result.mode); break;
    case "setup": cur={tab:"quiz"}; render(); break;
    case "cas-list": cur={tab:"cas"}; render(); break;
    case "cas-next": cur.step++; cur.choice=null; cur.order=null; render(); window.scrollTo(0,0); break;
    case "flip": cur.flip=!cur.flip; render(); break;
    case "deck-yes": if(!cur.failed.includes(cur.deck[cur.di])) cur.known++; cur.di++; cur.flip=false; render(); break;
    case "deck-no": if(!cur.failed.includes(cur.deck[cur.di])) cur.failed.push(cur.deck[cur.di]); cur.deck.push(cur.deck[cur.di]); cur.di++; cur.flip=false; render(); break;
    case "deck-again": cur.deck=null; render(); break;
  }
}
function copyText(txt, ok){
  const done=()=>toast(ok||"Copié");
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); return; } }catch(e){}
  fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("Copie impossible"); } ta.remove(); }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status"); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- Démarrage ---------- */
const h = location.hash.slice(1);
cur.tab = TABS.includes(h) ? h : "accueil";
render();
updateChip();
setInterval(updateChip, 60000);
})();
</script>
